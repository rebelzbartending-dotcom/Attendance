<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rebelz Attendance System</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --gold:#E8A020;--gold-l:#F5C842;--gold-dim:rgba(232,160,32,.13);
  --dk:#0D0D0D;--dk2:#161616;--dk3:#1E1E1E;--dk4:#282828;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#F0EDE8;--muted:#787672;--muted2:#454340;
  --green:#27AE60;--green-dim:rgba(39,174,96,.13);
  --red:#E74C3C;--red-dim:rgba(231,76,60,.13);
  --amber:#F39C12;--amber-dim:rgba(243,156,18,.13);
  --blue:#2E86C1;--blue-dim:rgba(46,134,193,.13);
  --ff:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dk);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh}
.hidden{display:none!important}
input,select,textarea{font-family:var(--fb);font-size:13px;color:var(--text);background:var(--dk3);border:1px solid var(--border2);border-radius:9px;padding:9px 13px;outline:none;transition:border .2s;width:100%}
input:focus,select:focus{border-color:var(--gold)}
select option{background:var(--dk3)}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:5px}
/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,rgba(232,160,32,.18) 0%,transparent 55%),var(--dk)}
.lbox{background:var(--dk2);border:1px solid var(--border2);border-radius:22px;padding:2.5rem 2rem;width:100%;max-width:370px}
.llogo{font-family:var(--ff);font-size:30px;font-weight:800;color:var(--gold);letter-spacing:-1.5px;text-align:center}
.lsub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;margin-top:3px}
.ltabs{display:flex;background:var(--dk3);border-radius:11px;padding:4px;margin-bottom:1.5rem;gap:3px}
.ltab{flex:1;padding:7px 4px;border-radius:8px;border:none;background:none;color:var(--muted);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .2s}
.ltab.on{background:var(--gold);color:var(--dk);font-weight:600}
.frow{margin-bottom:12px}
.btn-gold{width:100%;padding:12px;background:var(--gold);color:var(--dk);border:none;border-radius:11px;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-gold:hover{background:var(--gold-l)}
.lhint{text-align:center;font-size:11px;color:var(--muted);margin-top:.75rem}
.lhint b{color:var(--gold)}
/* APP SHELL */
#app{display:flex;min-height:100vh}
.sidebar{width:225px;flex-shrink:0;background:var(--dk2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 0;position:fixed;top:0;left:0;bottom:0;z-index:100}
.slogo{font-family:var(--ff);font-size:18px;font-weight:800;color:var(--gold);padding:0 1.25rem 1rem;border-bottom:1px solid var(--border);letter-spacing:-.5px}
.slogo span{display:block;font-size:9px;font-weight:400;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.suser{padding:.65rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:.4rem}
.su-name{font-size:13px;font-weight:600}
.su-role{font-size:11px;color:var(--muted);margin-top:1px}
.su-id{font-size:11px;color:var(--gold);font-family:monospace;margin-top:1px}
.su-br{font-size:11px;color:var(--amber);margin-top:1px}
nav{flex:1;padding:0 .6rem;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left}
.ni:hover{background:var(--dk3);color:var(--text)}
.ni.on{background:var(--gold-dim);color:var(--gold)}
.ni .ic{font-size:14px;width:17px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px}
.nsep{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.5px;padding:7px 10px 2px;font-weight:500}
.sbot{padding:.65rem 1.25rem;border-top:1px solid var(--border)}
.btnout{width:100%;padding:8px;background:var(--dk3);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--fb);margin-bottom:6px}
.btnout:hover{color:var(--red)}
.main{margin-left:225px;flex:1;padding:1.5rem}
.page{display:none}.page.on{display:block}
.ptitle{font-family:var(--ff);font-size:22px;font-weight:700;letter-spacing:-.5px}
.psub{color:var(--muted);font-size:13px;margin-top:3px;margin-bottom:1.5rem}
.card{background:var(--dk2);border:1px solid var(--border);border-radius:15px;padding:1.25rem;margin-bottom:1rem}
.ctitle{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:1rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem}
.stat{background:var(--dk3);border-radius:12px;padding:1rem}
.sv{font-family:var(--ff);font-size:24px;font-weight:700;color:var(--gold)}
.sl{font-size:12px;color:var(--muted);margin-top:3px}
.b{display:inline-block;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.bg{background:var(--green-dim);color:var(--green)}
.br{background:var(--red-dim);color:var(--red)}
.ba{background:var(--amber-dim);color:var(--amber)}
.bb{background:var(--blue-dim);color:var(--blue)}
.bgold{background:var(--gold-dim);color:var(--gold)}
.btn{padding:8px 16px;border-radius:9px;border:1px solid var(--border2);background:var(--dk3);color:var(--text);font-family:var(--fb);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--dk4)}
.btn-p{background:var(--gold);color:var(--dk);border-color:var(--gold);font-weight:600}
.btn-p:hover{background:var(--gold-l)}
.btn-d{background:var(--red-dim);color:var(--red);border-color:rgba(231,76,60,.25)}
.btn-s{background:var(--green-dim);color:var(--green);border-color:rgba(39,174,96,.25)}
.btn-b{background:var(--blue-dim);color:var(--blue);border-color:rgba(46,134,193,.25)}
.bsm{padding:4px 10px;font-size:12px}
.grow{display:flex;gap:8px;flex-wrap:wrap;margin-top:.85rem;align-items:center}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:11px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.av{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:var(--ff)}
.av-r{background:var(--green-dim);color:var(--green)}
.av-e{background:var(--blue-dim);color:var(--blue)}
.mark-card{max-width:450px;margin:0 auto;background:var(--dk2);border:1px solid var(--border2);border-radius:20px;padding:2rem}
.mu{display:flex;align-items:center;gap:14px;background:var(--dk3);border-radius:12px;padding:1rem;margin-bottom:1.5rem}
.mu-info .name{font-family:var(--ff);font-size:16px;font-weight:700}
.mu-info .role{font-size:12px;color:var(--muted);margin-top:2px}
.mu-info .sid{font-size:12px;color:var(--gold);font-family:monospace;margin-top:2px}
.mark-btn{width:100%;padding:17px;border:none;border-radius:13px;font-family:var(--ff);font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--dk);transition:all .2s;margin-top:1rem}
.mark-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,160,32,.3)}
.clock-card{max-width:420px;margin:0 auto;background:var(--dk2);border:1px solid var(--border2);border-radius:20px;padding:2rem;text-align:center}
.clock-time{font-family:var(--ff);font-size:44px;font-weight:800;color:var(--gold);letter-spacing:-2px;margin:.5rem 0}
.clock-date{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.cs{border-radius:12px;padding:.9rem;margin-bottom:1.25rem;font-size:13px}
.cs-done{background:var(--gold-dim);border:1px solid rgba(232,160,32,.3);color:var(--gold)}
.cs-in{background:var(--green-dim);border:1px solid rgba(39,174,96,.3);color:var(--green)}
.cs-out{background:var(--dk3);border:1px solid var(--border);color:var(--muted)}
.cs-inc{background:var(--amber-dim);border:1px solid rgba(243,156,18,.3);color:var(--amber)}
.big-btn{width:100%;padding:17px;border:none;border-radius:13px;font-family:var(--ff);font-size:17px;font-weight:800;cursor:pointer;transition:all .2s}
.bb-in{background:linear-gradient(135deg,var(--green),#2ECC71);color:#fff}
.bb-in:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(39,174,96,.3)}
.bb-out{background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--dk)}
.bb-out:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,160,32,.3)}
.sal-hero{background:linear-gradient(135deg,rgba(232,160,32,.15),rgba(232,160,32,.04));border:1px solid rgba(232,160,32,.3);border-radius:15px;padding:1.5rem;margin-bottom:1rem}
.sal-total{font-family:var(--ff);font-size:34px;font-weight:800;color:var(--gold)}
.sal-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.sal-bd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:1rem}
.sbd{background:rgba(0,0,0,.2);border-radius:10px;padding:.75rem}
.sbd-v{font-family:var(--ff);font-size:18px;font-weight:700}
.sbd-l{font-size:11px;color:var(--muted);margin-top:2px}
.frow-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.frow-bar select,.frow-bar input{width:auto;min-width:110px}
.ssep{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:2px;margin:1.2rem 0 .6rem}
.toast{position:fixed;bottom:20px;right:20px;background:var(--dk2);border:1px solid var(--border2);border-radius:12px;padding:10px 16px;font-size:13px;display:none;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:280px}
.toast.show{display:flex;align-items:center;gap:8px;animation:tin .3s ease}
.toast.ok{border-color:rgba(39,174,96,.5)}
.toast.er{border-color:rgba(231,76,60,.5)}
.toast.info{border-color:rgba(232,160,32,.5)}
@keyframes tin{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--dk2);border:1px solid var(--border2);border-radius:18px;padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--ff);font-size:16px;font-weight:700;margin-bottom:1.25rem}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.row-item:last-child{border-bottom:none}
code{font-family:monospace;font-size:12px;color:var(--gold);background:var(--gold-dim);padding:2px 6px;border-radius:5px}
.info-box{background:var(--dk3);border-radius:10px;padding:.75rem 1rem;font-size:12px;color:var(--muted);margin-bottom:1rem;border-left:3px solid var(--gold);line-height:1.6}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:13px}
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:13px}
.loading::after{content:'';animation:dots 1.5s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:1rem}
.report-card{background:var(--dk3);border:1px solid var(--border2);border-radius:12px;padding:1rem;cursor:pointer;transition:all .2s}
.report-card:hover{border-color:var(--gold)}
.report-card .rc-icon{font-size:24px;margin-bottom:8px}
.report-card .rc-title{font-family:var(--ff);font-size:14px;font-weight:600;margin-bottom:3px}
.report-card .rc-sub{font-size:12px;color:var(--muted)}
#cam-video{width:100%;border-radius:10px;display:none;max-height:200px;object-fit:cover;background:#000}
#cam-canvas{display:none}
.div{border:none;border-top:1px solid var(--border);margin:.9rem 0}
@media(max-width:700px){
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .fg2,.fg3,.fg4{grid-template-columns:1fr}
  .sal-bd{grid-template-columns:1fr 1fr}
  .sgrid{grid-template-columns:1fr 1fr}
}
.mob-btn{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--dk2);border:1px solid var(--border2);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:17px;color:var(--gold)}
@media(max-width:700px){.mob-btn{display:block}}
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════════════
const SB_URL = 'https://hsdusxwfyraualetqrhb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzZHVzeHdmeXJhdWFsZXRxcmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTE5NzksImV4cCI6MjA5NjA2Nzk3OX0.liBy1yYKYgEYB2ZtF_CNf7OMDkTd3tuLCRHSHkNaNDE';
const BRANCHES = ['Vijayawada','Hyderabad','Visakhapatnam'];
const ROLES = ['Senior Bartender','Bartender','Bar Assistant','Barista','Setup Crew','Trainer','Event Manager','Office Manager','Admin'];

let CU = null;
let _camStream = null;

// ═══════════════════════════════════════════════════
// SUPABASE API HELPERS
// ═══════════════════════════════════════════════════
const H = {'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

async function sbGet(table, query=''){
  try {
    const url = query ? `${SB_URL}/rest/v1/${table}?${query}` : `${SB_URL}/rest/v1/${table}`;
    const r = await fetch(url, {headers:{...H,'Prefer':'return=representation'}});
    if(!r.ok) { console.error('sbGet error:', r.status, await r.text()); return []; }
    return await r.json();
  } catch(e) { console.error('sbGet fetch error:', e); return []; }
}
async function sbPost(table, data){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(data)});
  return await r.json();
}
async function sbPatch(table, match, data){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${match}`, {method:'PATCH',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(data)});
  return await r.json();
}
async function sbDelete(table, match){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${match}`, {method:'DELETE',headers:H});
  return r.ok;
}
async function sbUpsert(table, data){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(data)});
  return await r.json();
}

// Upload photo to Supabase Storage
async function uploadPhoto(file, filename){
  const r = await fetch(`${SB_URL}/storage/v1/object/selfies/${filename}`, {
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'image/jpeg'},
    body:file
  });
  if(r.ok){
    return `${SB_URL}/storage/v1/object/public/selfies/${filename}`;
  }
  return null;
}

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function ini(n){return (n||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substring(2,7)}
function today(){return new Date().toISOString().split('T')[0]}
function nowtime(){return new Date().toTimeString().substring(0,5)}
function mkkey(d){const dt=new Date(d);return dt.toLocaleString('default',{month:'long',year:'numeric'})}
function isSunday(d){return new Date(d).getDay()===0}
function getSundays(y,m){let c=0,d=new Date(y,m,1);while(d.getMonth()===m){if(d.getDay()===0)c++;d.setDate(d.getDate()+1);}return c}
function getWorkDays(y,m){return new Date(y,m+1,0).getDate()-getSundays(y,m)}
function myBranch(){return CU?.branch==='ALL'?null:CU?.branch}
function toast(m,t='ok',dur=3000){const el=document.getElementById('toast');el.className='toast show '+t;el.innerHTML=(t==='ok'?'✓ ':t==='info'?'↻ ':'✗ ')+m;setTimeout(()=>el.className='toast',dur)}
function openModal(t,b){document.getElementById('modal-title').textContent=t;document.getElementById('modal-body').innerHTML=b;document.getElementById('modal-bg').classList.remove('hidden')}
function closeModal(){document.getElementById('modal-bg').classList.add('hidden')}
function loading(el){el.innerHTML='<div class="loading">Loading</div>'}

// ═══════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════
async function loadLoginDropdowns(){
  const statusEl = document.getElementById('login-status');
  if(statusEl) statusEl.textContent = 'Connecting to server...';
  // Load admins

async function getRate(staffId, monthKey){
  const data = await sbGet('month_rates', `staff_id=eq.${staffId}&month_key=eq.${encodeURIComponent(monthKey)}&select=rate`);
  if(Array.isArray(data) && data.length > 0) return data[0].rate;
  // Get last month rate
  const prev = await sbGet('month_rates', `staff_id=eq.${staffId}&select=rate,month_key&order=created_at.desc&limit=1`);
  if(Array.isArray(prev) && prev.length > 0) return prev[0].rate;
  // Fall back to staff default rate
  const s = await sbGet('staff', `id=eq.${staffId}&select=rate`);
  return (Array.isArray(s) && s.length > 0) ? s[0].rate || 0 : 0;
}

async function addStaff(){
  const name = document.getElementById('ns-name').value.trim();
  const phone = document.getElementById('ns-phone').value.trim();
  const br = document.getElementById('ns-br').value;
  const role = document.getElementById('ns-role').value;
  const type = document.getElementById('ns-type').value;
  const rate = parseFloat(document.getElementById('ns-rate').value)||0;
  const pin = document.getElementById('ns-pin').value.trim();
  if(!name){toast('Name required','er');return}
  if(pin.length!==4||isNaN(Number(pin))){toast('PIN must be 4 digits','er');return}
  const brCode = br==='Vijayawada'?'VJA':br==='Hyderabad'?'HYD':'VSK';
  const pfx = type==='regular' ? brCode+'-R' : brCode+'-';
  const existing = await sbGet('staff', `id=like.${pfx}*&select=id`);
  const cnt = Array.isArray(existing) ? existing.length : 0;
  const newId = pfx + String(cnt+1).padStart(type==='regular'?2:3,'0');
  const obj = {id:newId,name,phone,role,type,branch:br,pin,active:true};
  if(type==='regular') obj.salary=rate; else obj.rate=rate;
  const res = await sbPost('staff', obj);
  if(Array.isArray(res) && res.length > 0){
    toast(name+' added as '+newId);
    ['ns-name','ns-phone','ns-pin','ns-rate'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    loadStaffTable();
    loadLoginDropdowns();
  } else toast('Failed to add staff','er');
}

async function loadEvtTable(){
  const fb = document.getElementById('fe-br')?.value || myBranch() || '';
  let q = 'select=*';
  if(fb) q += `&branch=eq.${fb}`;
  const data = await sbGet('events', q);
  const el = document.getElementById('evt-t');
  if(!Array.isArray(data)||!data.length){el.innerHTML='<div class="empty">No events yet.</div>';return}
  // Get attendance counts
  el.innerHTML = `<table><thead><tr><th>Event</th><th>Date</th><th>Branch</th><th>Attendance</th><th>Status</th><th>Actions</th></tr></thead><tbody>
  ${data.map(e=>`<tr>
    <td style="font-weight:500">${e.name}</td><td>${e.date}</td><td>${e.branch}</td>
    <td id="att-cnt-${e.id}">—</td>
    <td><span class="b ${e.status==='open'?'bg':'ba'}">${e.status}</span></td>
    <td><div style="display:flex;gap:5px">
      ${e.status==='open'?`<button class="btn bsm btn-b" onclick="closeEvt('${e.id}')">Close</button>`:''}
      <button class="btn bsm btn-d" onclick="delEvt('${e.id}','${e.name}')">Delete</button>
    </div></td>
  </tr>`).join('')}</tbody></table>`;

async function loadClockTable(){
  const fb = document.getElementById('fcl-br')?.value||myBranch()||'';
  const fm = document.getElementById('fcl-mo')?.value||today().substring(0,7);
  const fs = document.getElementById('fcl-st')?.value||'';
  let q = `date=gte.${fm}-01&date=lte.${fm}-31&select=*`;
  if(fb) q+=`&branch=eq.${fb}`;
  if(fs) q+=`&status=eq.${fs}`;
  const data = await sbGet('clocklog',q);
  const staffData = await sbGet('staff','active=eq.true&select=id,name');
  const staffMap = {};
  if(Array.isArray(staffData)) staffData.forEach(s=>staffMap[s.id]=s.name);
  const el = document.getElementById('cl-t');
  if(!Array.isArray(data)||!data.length){el.innerHTML='<div class="empty">No records.</div>';return}
  el.innerHTML = `<table><thead><tr><th>Name</th><th>Date</th><th>Branch</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${data.map(c=>{
    const name = staffMap[c.staff_id]||c.staff_id;
    const day = new Date(c.date).toLocaleDateString('en-IN',{weekday:'short'});
    let hrs='—';
    if(c.in_time&&c.out_time){const[ih,im]=c.in_time.split(':').map(Number);const[oh,om]=c.out_time.split(':').map(Number);hrs=((oh*60+om-ih*60-im)/60).toFixed(1)+'h';}
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="av av-r">${ini(name)}</div>${name}</div></td>
      <td>${c.date} <span style="color:var(--muted);font-size:11px">${day}</span>${isSunday(c.date)?'<span class="b ba" style="margin-left:4px;font-size:10px">SUN</span>':''}</td>
      <td>${c.branch}</td>
      <td style="color:var(--green)">${c.in_time||'—'}</td>
      <td style="color:${c.out_time?'var(--amber)':'var(--red)'}">${c.out_time||'—'}</td>
      <td>${hrs}</td>
      <td><span class="b ${c.status==='complete'?'bg':c.status==='incomplete'?'ba':'br'}">${c.status}</span></td>
      <td>${c.status==='incomplete'?`<button class="btn bsm btn-b" onclick="fixClock('${c.id}','${name}','${c.in_time}','${c.date}')">Fix</button>`:'—'}</td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

async function loadSalary(){
  const mk = document.getElementById('ss-mo').value;
  const fb = document.getElementById('ss-br')?.value||myBranch()||'';
  const [mn,yr] = mk.split(' ');
  const mi = new Date(mk+' 1').getMonth();
  const yi = parseInt(yr);
  const wd = getWorkDays(yi,mi);
  const sun = getSundays(yi,mi);
  const td = new Date(yi,mi+1,0).getDate();
  let staffQ = 'active=eq.true&select=*';
  if(fb) staffQ += `&branch=eq.${fb}`;
  const [staffData, ratesData, lockData] = await Promise.all([
    sbGet('staff',staffQ),
    sbGet('month_rates',`month_key=eq.${encodeURIComponent(mk)}&select=*`),
    sbGet('salary_lock',`month_key=eq.${encodeURIComponent(mk)}${fb?`&branch=eq.${fb}`:''}`)
  ]);
  const staff = Array.isArray(staffData)?staffData:[];
  const ratesMap = {};
  if(Array.isArray(ratesData)) ratesData.forEach(r=>ratesMap[r.staff_id]=r.rate);
  const locked = Array.isArray(lockData)&&lockData.length>0;
  // Get attendance + clocklog for this month
  const [attData, clockData, extData] = await Promise.all([
    sbGet('attendance',`status=eq.approved&date=gte.${yi}-${String(mi+1).padStart(2,'0')}-01&date=lte.${yi}-${String(mi+1).padStart(2,'0')}-31${fb?`&branch=eq.${fb}`:''}&select=*`),
    sbGet('clocklog',`status=eq.complete&date=gte.${yi}-${String(mi+1).padStart(2,'0')}-01&date=lte.${yi}-${String(mi+1).padStart(2,'0')}-31${fb?`&branch=eq.${fb}`:''}&select=*`),
    sbGet('outsourced',`date=gte.${yi}-${String(mi+1).padStart(2,'0')}-01&date=lte.${yi}-${String(mi+1).padStart(2,'0')}-31${fb?`&branch=eq.${fb}`:''}&select=*`)
  ]);
  const att = Array.isArray(attData)?attData:[];
  const clocks = Array.isArray(clockData)?clockData:[];
  const ext = Array.isArray(extData)?extData:[];
  let regT=0,evtT=0;
  const extT = ext.reduce((s,o)=>s+o.amount,0);
  const regRows = staff.filter(s=>s.type==='regular').map(s=>{
    const dw = clocks.filter(c=>c.staff_id===s.id).length;
    const dr = (s.salary||0)/wd;
    const ea = Math.max(0,wd-4-dw);
    const ded = Math.round(ea*dr);
    const pay = (s.salary||0)-ded;
    regT+=pay;
    return {s,dw,wd,ea,ded,pay};
  });
  const evtRows = staff.filter(s=>s.type==='event').map(s=>{
    const rate = ratesMap[s.id]!==undefined ? ratesMap[s.id] : s.rate||0;
    const staffAtt = att.filter(a=>a.staff_id===s.id);
    const pay = staffAtt.length*rate;
    evtT+=pay;
    return {s,rate,cnt:staffAtt.length,pay};
  });
  const grand = regT+evtT+extT;
  document.getElementById('sal-wrap').innerHTML = `
  <div class="sal-hero">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div>
        <div class="sal-total">₹${grand.toLocaleString()}</div>
        <div class="sal-lbl">Grand Total — ${mk}${fb?' · '+fb:' · All Branches'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:5px">Working days: ${wd} (${td} − ${sun} Sundays) · 4 paid offs per staff</div>
      </div>${locked?'<span class="b bg">🔒 Finalized</span>':''}
    </div>
    <div class="sal-bd">

async function doExportReport(type){
  const mo = document.getElementById('rpt-mo')?.value||mkkey(today());
  const br = document.getElementById('rpt-br')?.value||myBranch()||'';
  toast('Preparing report...','info');
  const wb = XLSX.utils.book_new();
  if(type==='daily'||type==='monthly'){
    const [mk,yr] = mo.split(' ');
    const mi = new Date(mo+' 1').getMonth();
    const yi = parseInt(yr);
    const wd = getWorkDays(yi,mi);
    let staffQ = 'active=eq.true&select=*';if(br)staffQ+=`&branch=eq.${br}`;
    const [staffData,attData,clockData,extData,ratesData] = await Promise.all([
      sbGet('staff',staffQ),
      sbGet('attendance',`status=eq.approved&date=gte.${yi}-${String(mi+1).padStart(2,'0')}-01&date=lte.${yi}-${String(mi+1).padStart(2,'0')}-31${br?`&branch=eq.${br}`:''}&select=*`),
      sbGet('clocklog',`status=eq.complete&date=gte.${yi}-${String(mi+1).padStart(2,'0')}-01&date=lte.${yi}-${String(mi+1).padStart(2,'0')}-31${br?`&branch=eq.${br}`:''}&select=*`),
      sbGet('outsourced',`date=gte.${yi}-${String(mi+1).padStart(2,'0')}-01&date=lte.${yi}-${String(mi+1).padStart(2,'0')}-31${br?`&branch=eq.${br}`:''}&select=*`),
      sbGet('month_rates',`month_key=eq.${encodeURIComponent(mo)}&select=*`)
    ]);
    const staff=Array.isArray(staffData)?staffData:[];
    const att=Array.isArray(attData)?attData:[];
    const clocks=Array.isArray(clockData)?clockData:[];
    const ext=Array.isArray(extData)?extData:[];
    const rMap={};if(Array.isArray(ratesData))ratesData.forEach(r=>rMap[r.staff_id]=r.rate);
    // Summary
    let rT=0,eT=0,xT=ext.reduce((s,o)=>s+o.amount,0);
    staff.filter(s=>s.type==='regular').forEach(s=>{const dw=clocks.filter(c=>c.staff_id===s.id).length;const ea=Math.max(0,wd-4-dw);const ded=Math.round(ea*(s.salary||0)/wd);rT+=(s.salary||0)-ded;});
    staff.filter(s=>s.type==='event').forEach(s=>{const rate=rMap[s.id]!==undefined?rMap[s.id]:s.rate||0;eT+=att.filter(a=>a.staff_id===s.id).length*rate;});
    const sumRows=[['REBELZ EVENTS & PROMOTIONS'],['Monthly Salary — '+mo+(br?' · '+br:' · All Branches')],['Generated',new Date().toLocaleString()],[''],
      ['Category','Amount (₹)'],['Regular Staff',rT],['Event Staff',eT],['Outsourced',xT],['GRAND TOTAL',rT+eT+xT],[''],['Working Days',wd],['Sundays',getSundays(yi,mi)],['Paid Offs','4 per staff']];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sumRows),'Summary');
    // Regular
    const rRows=[['Staff ID','Name','Role','Branch','Salary','Work Days','Worked','Extra Absent','Deduction','Final Pay']];
    staff.filter(s=>s.type==='regular').forEach(s=>{const dw=clocks.filter(c=>c.staff_id===s.id).length;const ea=Math.max(0,wd-4-dw);const ded=Math.round(ea*(s.salary||0)/wd);rRows.push([s.id,s.name,s.role,s.branch,s.salary||0,wd,dw,ea,ded,(s.salary||0)-ded]);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rRows),'Regular Staff');
    // Event
    const eRows=[['Staff ID','Name','Role','Branch','Rate','Events Attended','Total Pay']];
    staff.filter(s=>s.type==='event').forEach(s=>{const rate=rMap[s.id]!==undefined?rMap[s.id]:s.rate||0;const cnt=att.filter(a=>a.staff_id===s.id).length;eRows.push([s.id,s.name,s.role,s.branch,rate,cnt,cnt*rate]);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(eRows),'Event Staff');
    // Outsourced
    const xRows=[['ID','Name','Role','Branch','Date','Amount','Paid']];
    ext.forEach(o=>xRows.push([o.id,o.name,o.role,o.branch,o.date,o.amount,o.paid?'PAID':'UNPAID']));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(xRows),'Outsourced');
    // Attendance detail
    const aRows=[['Staff ID','Date','Time','Role','Branch','Status','GPS Lat','GPS Lng','Has Photo']];
    att.forEach(a=>aRows.push([a.staff_id,a.date,a.time,a.role,a.branch,a.status,a.gps_lat||'',a.gps_lng||'',a.photo_url?'YES':'NO']));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aRows),'Attendance Detail');
  }
  if(type==='staff'){
    const staffData=await sbGet('staff','select=*');
    const rows=[['ID','Name','Phone','Role','Type','Branch','Salary/Rate','Active']];
    if(Array.isArray(staffData))staffData.forEach(s=>rows.push([s.id,s.name,s.phone||'',s.role,s.type,s.branch,s.type==='regular'?s.salary:s.rate,s.active?'Yes':'No']));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Staff Master');
  }
  if(type==='events'){
    const evData=await sbGet('events','select=*');
    const attAll=await sbGet('attendance','select=*');
    const rows=[['Event Name','Date','Branch','Status','Staff ID','Role','Time','Status','GPS Lat','GPS Lng','Has Photo']];
    if(Array.isArray(evData))evData.forEach(e=>{
      const ea=Array.isArray(attAll)?attAll.filter(a=>a.event_id===e.id):[];
      if(!ea.length)rows.push([e.name,e.date,e.branch,e.status,'','','','No attendance','','','']);
      else ea.forEach(a=>rows.push([e.name,e.date,e.branch,e.status,a.staff_id,a.role,a.time,a.status,a.gps_lat||'',a.gps_lng||'',a.photo_url?'YES':'NO']));
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Event Report');
  }
  XLSX.writeFile(wb,`Rebelz_${type}_${(br||'All').replace(/\s/g,'_')}_${mo.replace(' ','_')}.xlsx`);
  toast('Report downloaded ✓');
}

}

function startCam(){
  document.getElementById('cam-ph').style.display='none';
  document.getElementById('cam-ac').style.display='block';
  const v=document.getElementById('cam-video');v.style.display='block';
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
    .then(stream=>{_camStream=stream;v.srcObject=stream;v.play();})
    .catch(()=>{toast('Allow camera access in browser settings','er');document.getElementById('cam-ph').style.display='block';document.getElementById('cam-ac').style.display='none';});
}
function capPhoto(){
  const v=document.getElementById('cam-video');const c=document.getElementById('cam-canvas');
  c.width=300;c.height=300;
  const ctx=c.getContext('2d');
  const sz=Math.min(v.videoWidth,v.videoHeight);
  ctx.drawImage(v,(v.videoWidth-sz)/2,(v.videoHeight-sz)/2,sz,sz,0,0,300,300);
  c.toBlob(blob=>{
    window._photoBlob=blob;
    window._photo=URL.createObjectURL(blob);
    stopCam();
    document.getElementById('photo-img').src=window._photo;
    document.getElementById('photo-prev').style.display='block';
    document.getElementById('cam-ph').style.display='none';
    document.getElementById('cam-ac').style.display='none';
    toast('Selfie captured ✓');
  },'image/jpeg',0.7);
}
function retakeP(){window._photo=null;window._photoBlob=null;document.getElementById('photo-prev').style.display='none';document.getElementById('cam-ph').style.display='block';}
function stopCam(){if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}document.getElementById('cam-video').style.display='none';}
function getGPS(){
  const s=document.getElementById('gps-s');const btn=document.getElementById('gps-btn');
  s.innerHTML='<span style="color:var(--amber)">Getting location...</span>';btn.textContent='...';btn.disabled=true;
  if(!navigator.geolocation){s.innerHTML='<span style="color:var(--red)">GPS not supported</span>';btn.textContent='Retry';btn.disabled=false;return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude.toFixed(6),lng=pos.coords.longitude.toFixed(6),acc=Math.round(pos.coords.accuracy);
    window._gps={lat,lng,acc};
    s.innerHTML=`<span style="color:var(--green)">✓ ${lat}, ${lng} (±${acc}m)</span>`;
    btn.textContent='✓ Done';btn.style.background='var(--green-dim)';btn.style.color='var(--green)';
    document.getElementById('gps-link-wrap').style.display='block';
    document.getElementById('gps-link').href=`https://www.google.com/maps?q=${lat},${lng}`;
  },()=>{s.innerHTML='<span style="color:var(--red)">Failed. Allow location access.</span>';btn.textContent='Retry';btn.disabled=false;},{timeout:15000,enableHighAccuracy:true});
}

async function submitMark(){
  const ev=document.getElementById('mk-ev').value;
  const role=document.getElementById('mk-role').value;
  const time=document.getElementById('mk-time').value;
  if(!ev){toast('Select an event','er');return}
  if(!window._photo){toast('Take your selfie first','er');return}
  if(!window._gps){toast('Capture your GPS location','er');return}
  toast('Submitting...','info');
  stopCam();
  // Upload selfie to Supabase Storage
  let photoUrl = null;
  if(window._photoBlob){
    const filename = `${CU.id}_${today()}_${uid()}.jpg`;
    photoUrl = await uploadPhoto(window._photoBlob, filename);
  }
  const res = await sbPost('attendance',{
    id:'ATT-'+uid(),
    staff_id:CU.id,
    event_id:ev,
    date:today(),
    time,role,
    status:'pending',
    branch:CU.branch,
    photo_url:photoUrl,
    gps_lat:window._gps.lat,
    gps_lng:window._gps.lng,
    gps_acc:String(window._gps.acc)
  });
  if(Array.isArray(res)&&res.length>0){
    window._photo=null;window._photoBlob=null;window._gps=null;
    toast('Attendance submitted with selfie & GPS ✓');
    pgMark(document.getElementById('mc'));
  } else toast('Submission failed. Try again.','er');
}

    <div class="stat"><div class="sv" style="color:var(--amber)">${thisMonth.filter(a=>a.status==='pending').length}</div><div class="sl">Pending</div></div>
    <div class="stat"><div class="sv">${records.length}</div><div class="sl">Total All Time</div></div>
  </div>
  <div class="card"><div class="tw"><table><thead><tr><th>Event</th><th>Date</th><th>Role</th><th>Selfie</th><th>GPS</th><th>Status</th></tr></thead>

    <td>${a.gps_lat?`<a href="https://www.google.com/maps?q=${a.gps_lat},${a.gps_lng}" target="_blank" style="color:var(--gold);font-size:11px">📍 View</a>`:'—'}</td>

async function pgMyPay(el){
  loading(el);
  const s = CU;
  const mk = mkkey(today());
  const d = today();
  if(s.type==='event'){
    const [rateData,attData,pendData] = await Promise.all([
      sbGet('month_rates',`staff_id=eq.${s.id}&month_key=eq.${encodeURIComponent(mk)}&select=rate`),
      sbGet('attendance',`staff_id=eq.${s.id}&status=eq.approved&date=gte.${d.substring(0,7)}-01&date=lte.${d.substring(0,7)}-31&select=id`),
      sbGet('attendance',`staff_id=eq.${s.id}&status=eq.pending&select=id`)
    ]);
    const rate = Array.isArray(rateData)&&rateData[0] ? rateData[0].rate : s.rate||0;
    const approved = Array.isArray(attData)?attData.length:0;
    const pending = Array.isArray(pendData)?pendData.length:0;
    const pay = approved*rate;
    el.innerHTML = `<div style="max-width:400px">
    <div class="ptitle">My Pay</div><div class="psub">${mk}</div>
    <div class="sal-hero"><div class="sal-total">₹${pay.toLocaleString()}</div>
      <div class="sal-lbl">${approved} events × ₹${rate.toLocaleString()}</div>
    </div>
    <div class="card">
      ${[['Staff ID',`<code>${s.id}</code>`],['Role',s.role],['Branch',s.branch],['Type','<span class="b bb">Event-based</span>'],
        ['Rate this month','₹'+rate.toLocaleString()+' / event'],['Approved events','<b style="color:var(--green)">'+approved+'</b>'],['Pending',`<span style="color:var(--amber)">${pending} entries</span>`]]
        .map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">${l}</span><span>${v}</span></div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--muted);text-align:center">Final amount confirmed after admin approval</div>
    </div>`;
  } else {
    const clockData = await sbGet('clocklog',`staff_id=eq.${s.id}&status=eq.complete&date=gte.${d.substring(0,7)}-01&date=lte.${d.substring(0,7)}-31&select=id`);
    const dw = Array.isArray(clockData)?clockData.length:0;
    const wd = getWorkDays(new Date().getFullYear(),new Date().getMonth());
    const ea = Math.max(0,wd-4-dw);
    const dr = (s.salary||0)/wd;
    const ded = Math.round(ea*dr);
    const pay = (s.salary||0)-ded;
    el.innerHTML = `<div style="max-width:400px">
    <div class="ptitle">My Pay</div><div class="psub">${mk}</div>
    <div class="sal-hero"><div class="sal-total">₹${pay.toLocaleString()}</div>
      <div class="sal-lbl">Fixed monthly salary ${ded>0?'(−₹'+ded.toLocaleString()+' deduction)':''}</div>
    </div>
    <div class="card">
      ${[['Staff ID',`<code>${s.id}</code>`],['Role',s.role],['Branch',s.branch],['Type','<span class="b bg">Regular</span>'],
        ['Monthly Salary','₹'+(s.salary||0).toLocaleString()],['Days Worked',''+dw],['Extra Absent',ea>0?'<span style="color:var(--red)">'+ea+' days</span>':'—'],['Deduction',ded>0?'<span style="color:var(--red)">−₹'+ded.toLocaleString()+'</span>':'—']]
        .map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">${l}</span><span>${v}</span></div>`).join('')}
    </div>
    </div>`;
  }
}
