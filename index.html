<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rebelz Attendance System</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --gold:#E3B85F;--gold-l:#F4D183;--gold-dim:rgba(227,184,95,.14);
  --dk:#0F0A0C;--dk2:#1A1013;--dk3:#22161A;--dk4:#301E24;
  --border:rgba(255,255,255,.07);--border2:rgba(255,220,225,.13);
  --text:#F4ECEE;--muted:#9A8288;--muted2:#574349;
  --green:#46BE7E;--green-dim:rgba(70,190,126,.14);
  --red:#E5604B;--red-dim:rgba(229,96,75,.14);
  --amber:#F0A93C;--amber-dim:rgba(240,169,60,.14);
  --blue:#5B8FD9;--blue-dim:rgba(91,143,217,.14);
  --ff:'Playfair Display',Georgia,serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dk);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh}
.hidden{display:none!important}
input,select,textarea{font-family:var(--fb);font-size:13px;color:var(--text);background:var(--dk3);border:1px solid var(--border2);border-radius:9px;padding:9px 13px;outline:none;transition:border .2s;width:100%}
input:focus,select:focus{border-color:var(--gold)}
select option{background:var(--dk3)}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:5px}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,rgba(178,58,84,.22) 0%,transparent 58%),var(--dk)}
.lbox{background:var(--dk2);border:1px solid var(--border2);border-radius:22px;padding:2.5rem 2rem;width:100%;max-width:370px}
.llogo{font-family:var(--ff);font-size:32px;font-weight:800;color:var(--gold);letter-spacing:.5px;text-align:center}
.lsub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;margin-top:3px}
.ltabs{display:flex;background:var(--dk3);border-radius:11px;padding:4px;margin-bottom:1.5rem;gap:3px}
.ltab{flex:1;padding:7px 4px;border-radius:8px;border:none;background:none;color:var(--muted);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .2s}
.ltab.on{background:var(--gold);color:var(--dk);font-weight:600}
.frow{margin-bottom:12px}
.btn-gold{width:100%;padding:12px;background:var(--gold);color:var(--dk);border:none;border-radius:11px;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-gold:hover{background:var(--gold-l)}
.ss-wrap{position:relative}
.ss-wrap input.ss-picked{border-color:var(--gold)}
.ss-results{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--dk3);border:1px solid var(--border2);border-radius:10px;max-height:240px;overflow-y:auto;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.55);-webkit-overflow-scrolling:touch}
.ss-row{padding:12px 13px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.3}
.ss-row:last-child{border-bottom:none}
.ss-row:active,.ss-row:hover{background:var(--dk4)}
.ss-row .sid{color:var(--muted);font-size:11px}
.ss-empty{padding:12px 13px;color:var(--muted);font-size:12px}
.lhint{text-align:center;font-size:11px;color:var(--muted);margin-top:.75rem}
.lhint b{color:var(--gold)}
#app{display:flex;min-height:100vh}
.sidebar{width:225px;flex-shrink:0;background:var(--dk2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 0;position:fixed;top:0;left:0;bottom:0;z-index:100}
.slogo{font-family:var(--ff);font-size:19px;font-weight:800;color:var(--gold);padding:0 1.25rem 1rem;border-bottom:1px solid var(--border);letter-spacing:.3px}
.slogo span{display:block;font-size:9px;font-weight:400;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.slogo{text-align:center}

.brand-logo{background:var(--rebelz-logo) center/contain no-repeat}
.llogo-img{height:92px;margin:0 auto 10px}
.slogo-img{height:50px;margin:0 auto 8px}
.mo-bar{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
.mo-bar .mo-nav{background:var(--dk3);border:1px solid var(--border);color:var(--gold);border-radius:8px;min-width:32px;height:32px;font-size:14px;cursor:pointer;line-height:1}
.mo-bar .mo-nav:active{background:var(--dk4)}
.mo-bar input[type=month]{width:auto}
.suser{padding:.65rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:.4rem}
.su-name{font-size:13px;font-weight:600}
.su-role{font-size:11px;color:var(--muted);margin-top:1px}
.su-id{font-size:11px;color:var(--gold);font-family:monospace;margin-top:1px}
.su-br{font-size:11px;color:var(--amber);margin-top:1px}
nav{flex:1;padding:0 .6rem;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left}
.ni:hover{background:var(--dk3);color:var(--text)}
.ni.on{background:var(--gold-dim);color:var(--gold)}
.ni .ic{font-size:14px;width:17px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px}
.nsep{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.5px;padding:7px 10px 2px;font-weight:500}
.sbot{padding:.65rem 1.25rem;border-top:1px solid var(--border)}
.btnout{width:100%;padding:8px;background:var(--dk3);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--fb);margin-bottom:6px}
.btnout:hover{color:var(--red)}
.main{margin-left:225px;flex:1;padding:1.5rem}
.page{display:none}.page.on{display:block}
.ptitle{font-family:var(--ff);font-size:23px;font-weight:700;letter-spacing:0}
.psub{color:var(--muted);font-size:13px;margin-top:3px;margin-bottom:1.5rem}
.card{background:var(--dk2);border:1px solid var(--border);border-radius:15px;padding:1.25rem;margin-bottom:1rem}
.ctitle{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:1rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem}
.stat{background:var(--dk3);border-radius:12px;padding:1rem}
.sv{font-family:var(--ff);font-size:24px;font-weight:700;color:var(--gold)}
.sl{font-size:12px;color:var(--muted);margin-top:3px}
.b{display:inline-block;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}

<script>
// ═══════════════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════════════
const SB_URL = 'https://hsdusxwfyraualetqrhb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzZHVzeHdmeXJhdWFsZXRxcmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTE5NzksImV4cCI6MjA5NjA2Nzk3OX0.liBy1yYKYgEYB2ZtF_CNf7OMDkTd3tuLCRHSHkNaNDE';
const BRANCHES = ['Vijayawada','Hyderabad','Visakhapatnam'];
const ROLES = ['Senior Bartender','Bartender','Bar Assistant','Barista','Setup Crew','Trainer','Event Manager','Office Manager','Admin'];
let CU = null;
let _camStream = null;
// ═══════════════════════════════════════════════════
// SUPABASE API HELPERS
// ═══════════════════════════════════════════════════
const H = {'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
async function sbGet(table, query=''){
  try {
    const url = query ? `${SB_URL}/rest/v1/${table}?${query}` : `${SB_URL}/rest/v1/${table}`;
    const r = await fetch(url, {headers:{...H,'Prefer':'return=representation'}});
    if(!r.ok) { console.error('sbGet error:', r.status, await r.text()); return []; }
    return await r.json();
  } catch(e) { console.error('sbGet fetch error:', e); return []; }
}
async function sbPost(table, data){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(data)});
  return await r.json();
}
async function sbPatch(table, match, data){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${match}`, {method:'PATCH',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(data)});
  return await r.json();
}
async function sbDelete(table, match){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${match}`, {method:'DELETE',headers:H});
  return r.ok;
}
async function sbUpsert(table, data){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(data)});
  return await r.json();
}
async function uploadPhoto(file, filename){
  try {
    const r = await fetch(`${SB_URL}/storage/v1/object/selfies/${filename}`, {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},
      body:file
    });
    if(r.ok){ return `${SB_URL}/storage/v1/object/public/selfies/${filename}`; }
    else { console.error('Photo upload failed:', r.status, await r.text()); return null; }
  } catch(e) { console.error('Photo upload error:', e); return null; }
}
// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function ini(n){return (n||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substring(2,7)}
function today(){return new Date().toISOString().split('T')[0]}
function nowtime(){return new Date().toTimeString().substring(0,5)}
function mkkey(d){const dt=new Date(d);return dt.toLocaleString('default',{month:'long',year:'numeric'})}
function isSunday(d){return new Date(d).getDay()===0}
function getSundays(y,m){let c=0,d=new Date(y,m,1);while(d.getMonth()===m){if(d.getDay()===0)c++;d.setDate(d.getDate()+1);}return c}
function getWorkDays(y,m){return new Date(y,m+1,0).getDate()-getSundays(y,m)}
function monthEnd(ym){const[y,m]=ym.split('-').map(Number);return String(new Date(y,m,0).getDate()).padStart(2,'0');}

function fmtMonth(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('default',{month:'long',year:'numeric'});}
function monthRange(ym){return `date=gte.${ym}-01&date=lte.${ym}-${monthEnd(ym)}`;}
function stepMonth(id,delta,cb){const inp=document.getElementById(id);if(!inp)return;let v=inp.value||today().substring(0,7);let a=v.split('-').map(Number);let y=a[0],m=a[1]+delta;if(m<1){m=12;y--}if(m>12){m=1;y++}inp.value=y+'-'+String(m).padStart(2,'0');if(cb&&typeof window[cb]==='function')window[cb]();}
function moBar(id,val,cb){return `<div class="mo-bar"><button class="mo-nav" onclick="stepMonth('${id}',-1,'${cb}')">&#9664;</button><input type="month" id="${id}" value="${val}" onchange="${cb}()"><button class="mo-nav" onclick="stepMonth('${id}',1,'${cb}')">&#9654;</button></div>`;}
function reloadApprovals(){const v=document.getElementById('appr-mo')?.value||today().substring(0,7);pgApprovals(document.getElementById('mc'),v);}
function reloadMonthly(){const v=document.getElementById('rev-mo')?.value;if(v)window.__revMonth=v;pgMonthly(document.getElementById('mc'));}
function tapReview(page){window.__navMonth=window.__revMonth||today().substring(0,7);showPage(page);}
async function pgMonthly(el){
  loading(el);
  const br = myBranch();
  const selMonth = window.__revMonth || window.__navMonth || today().substring(0,7);
  window.__revMonth = selMonth; window.__navMonth=null;
  const brq = br?`branch=eq.${br}&`:'';
  const [evs, att, out, pendAll] = await Promise.all([
    sbGet('events', `${brq}${monthRange(selMonth)}&select=id,status&limit=100000`),
    sbGet('attendance', `${brq}${monthRange(selMonth)}&select=status,rate_applied&limit=100000`),
    sbGet('outsourced', `${brq}${monthRange(selMonth)}&select=amount,paid&limit=100000`),
    sbGet('attendance', `${brq}status=eq.pending&select=id&limit=100000`)
  ]);
  const E=Array.isArray(evs)?evs:[], A=Array.isArray(att)?att:[], O=Array.isArray(out)?out:[], P=Array.isArray(pendAll)?pendAll:[];
  const evOpen=E.filter(e=>e.status==='open').length;
  const pend=A.filter(a=>a.status==='pending').length;
  const appr=A.filter(a=>a.status==='approved');
  const rej=A.filter(a=>a.status==='rejected').length;
  const payout=appr.reduce((s,a)=>s+(Number(a.rate_applied)||0),0);
  const outTotal=O.reduce((s,o)=>s+(Number(o.amount)||0),0);
  const outPaid=O.filter(o=>o.paid).reduce((s,o)=>s+(Number(o.amount)||0),0);
  const outUnpaid=outTotal-outPaid;
  const pendOther=Math.max(0, P.length - pend);
  el.innerHTML = `
  <div class="ptitle">Monthly Review</div>
  <div class="frow-bar" style="margin-bottom:14px"><div class="psub" style="margin:0;flex:1">${br||'All Branches'} &middot; ${fmtMonth(selMonth)}</div>${moBar('rev-mo',selMonth,'reloadMonthly')}</div>
  <div class="sgrid">
    <div class="stat" style="cursor:pointer" onclick="tapReview('events')"><div class="sv">${E.length}</div><div class="sl">Events</div></div>
    <div class="stat" style="cursor:pointer" onclick="tapReview('approvals')"><div class="sv" style="color:var(--amber)">${pend}</div><div class="sl">Pending to Recheck</div></div>
    <div class="stat"><div class="sv" style="color:var(--green)">${appr.length}</div><div class="sl">Approved</div></div>
    <div class="stat"><div class="sv" style="color:var(--gold)">&#8377;${payout.toLocaleString()}</div><div class="sl">Event Payout</div></div>
  </div>
  <div class="fg2">
    <div class="card"><div class="ctitle">Attendance</div>
      <div class="row-item"><div style="flex:1">&#9989; Approved</div><b>${appr.length}</b></div>
      <div class="row-item"><div style="flex:1">&#8987; Pending</div><b style="color:var(--amber)">${pend}</b></div>
      <div class="row-item"><div style="flex:1">&#10007; Rejected</div><b style="color:var(--red)">${rej}</b></div>
      <div class="row-item"><div style="flex:1">Approved Payout</div><b style="color:var(--gold)">&#8377;${payout.toLocaleString()}</b></div>
    </div>
    <div class="card" style="cursor:pointer" onclick="tapReview('outsourced')"><div class="ctitle">Outsourced Spend</div>
      <div class="row-item"><div style="flex:1">Total</div><b style="color:var(--gold)">&#8377;${outTotal.toLocaleString()}</b></div>
      <div class="row-item"><div style="flex:1">&#10003; Paid</div><b style="color:var(--green)">&#8377;${outPaid.toLocaleString()}</b></div>
      <div class="row-item"><div style="flex:1">Unpaid</div><b style="color:var(--red)">&#8377;${outUnpaid.toLocaleString()}</b></div>
      <div class="row-item"><div style="flex:1">People hired</div><b>${O.length}</b></div>
    </div>
  </div>
  <div class="card"><div class="ctitle">&#9888; Needs Attention</div>
    ${(pend===0&&evOpen===0&&outUnpaid===0&&pendOther===0)?'<div class="empty">&#10003; All clear for this month.</div>':`
    ${pend>0?`<div class="row-item"><div style="flex:1">${pend} pending approval${pend>1?'s':''} this month</div><button class="btn bsm btn-p" onclick="tapReview('approvals')">Review</button></div>`:''}
    ${pendOther>0?`<div class="row-item"><div style="flex:1">${pendOther} pending in other months</div><button class="btn bsm btn-b" onclick="tapReview('approvals')">Open</button></div>`:''}
    ${evOpen>0?`<div class="row-item"><div style="flex:1">${evOpen} event${evOpen>1?'s':''} still open (not closed)</div><button class="btn bsm btn-b" onclick="tapReview('events')">View</button></div>`:''}
    ${outUnpaid>0?`<div class="row-item"><div style="flex:1">&#8377;${outUnpaid.toLocaleString()} unpaid to outsourced staff</div><button class="btn bsm btn-b" onclick="tapReview('outsourced')">Pay</button></div>`:''}
  `}</div>`;
}

function myBranch(){return CU?.branch==='ALL'?null:CU?.branch}
function isManager(){return CU?.userType==='admin' && CU?.role==='Branch Manager';}
function toast(m,t='ok',dur=3000){const el=document.getElementById('toast');el.className='toast show '+t;el.innerHTML=(t==='ok'?'✓ ':t==='info'?'↻ ':'✗ ')+m;setTimeout(()=>el.className='toast',dur)}
function openModal(t,b){document.getElementById('modal-title').textContent=t;document.getElementById('modal-body').innerHTML=b;document.getElementById('modal-bg').classList.remove('hidden')}

async function callKyc(action, extra){
  const body = {action};
  if(CU && CU.userType==='admin'){ body.admin_id=CU.id; body.admin_pass=CU.pass; }
  else { body.staff_id=CU.id; body.pin=CU.pin; }
  Object.assign(body, extra||{});
  try{
    const r = await fetch(`${SB_URL}/functions/v1/staff-kyc`, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body: JSON.stringify(body)
    });
    let j = {}; try{ j = await r.json(); }catch(e){}
    return {ok:r.ok, status:r.status, data:j};
  }catch(e){ return {ok:false, status:0, data:{error:'Network error. Check internet and try again.'}}; }
}
// staff picks/takes a photo -> compress to a square JPEG (base64) for upload
window._kpPhoto = null;
function kpPickPhoto(input){
  const file = input.files && input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = e => {
    const img = new Image();
    img.onload = () => {
      const sz=400, c=document.createElement('canvas'); c.width=sz; c.height=sz;
      const ctx=c.getContext('2d'); const s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,sz,sz);
      const dataUrl=c.toDataURL('image/jpeg',0.82);
      window._kpPhoto=dataUrl;
      const pv=document.getElementById('kp-photo-img');
      if(pv){ pv.src=dataUrl; pv.style.display='block'; }
      const ph=document.getElementById('kp-photo-ph'); if(ph) ph.style.display='none';
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

async function saveMyProfile(){
  const g = id => (document.getElementById(id).value||'').trim();
  const msg = document.getElementById('kp-msg');
  msg.style.color='var(--red)'; msg.textContent='';
  const aadhaar = g('kp-aadhaar').replace(/\s/g,'');
  const acc = g('kp-acc'), acc2 = g('kp-acc2');
  const ifsc = g('kp-ifsc').toUpperCase();
  const consent = document.getElementById('kp-consent').checked;
  if(aadhaar && !/^\d{12}$/.test(aadhaar)){ msg.textContent='Aadhaar must be exactly 12 digits.'; return; }
  if(acc && acc!==acc2){ msg.textContent='Account numbers do not match.'; return; }
  if(ifsc && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)){ msg.textContent='IFSC looks wrong (example: HDFC0001234).'; return; }
  if(!consent){ msg.textContent='Please tick the confirmation box before saving.'; return; }
  const btn = document.getElementById('kp-save');
  btn.disabled=true; const old=btn.textContent; btn.textContent='Saving...';
  const payload = {
    full_name:g('kp-name'), aadhaar, account_holder:g('kp-holder'),
    bank_account:acc, ifsc, bank_name:g('kp-bank'),
    emergency_phone:g('kp-ephone'), emergency_name:g('kp-ename'), emergency_relation:g('kp-erel'),
    consent:true
  };
  if(window._kpPhoto) payload.photo_b64 = window._kpPhoto;
  const res = await callKyc('save', payload);
  btn.disabled=false; btn.textContent=old;
  if(res.ok && res.data && res.data.ok){
    toast('Your details are saved','ok');
    window._kpPhoto=null;
    const vd = document.getElementById('kp-verify');
    if(res.data.account_verified){ vd.innerHTML=`✓ <span style="color:var(--green)">Account verified — ${res.data.verified_name||''}</span>`; }
    msg.style.color='var(--green)'; msg.textContent='Saved successfully.';
  } else {
    msg.textContent = (res.data && res.data.error) ? res.data.error : 'Could not save. Check your details and try again.';
  }
}

function kpMask(s, keep){ s=String(s||''); if(s.length<=keep) return s; return '•'.repeat(Math.max(0,s.length-keep))+s.slice(-keep); }
function kpRevealTag(id, full){
  const f=String(full||''); if(!f) return '—';
  return `<span id="${id}" data-full="${f}">${kpMask(f,4)}</span> <span class="reveal" style="font-size:10px;color:var(--gold);border:1px solid var(--border2);border-radius:6px;padding:2px 7px;cursor:pointer" onclick="const e=document.getElementById('${id}');e.textContent=e.dataset.full;this.remove()">Reveal</span>`;
}

function filterStaff(type, q){
  const box   = document.getElementById(type==='regular'?'rs-results':'es-results');
  const input = document.getElementById(type==='regular'?'rs-search':'es-search');
  if(!box||!input) return;
  STAFF_SEL[type] = null; input.classList.remove('ss-picked');
  const term = (q||'').trim().toLowerCase();
  let matches = STAFF_LIST[type] || [];
  if(term){
    matches = matches.filter(s =>
      (s.name||'').toLowerCase().includes(term) ||
      (s.id||'').toLowerCase().includes(term) ||
      (s.branch||'').toLowerCase().includes(term));
  }
  matches = matches.slice(0, 40);
  if(matches.length === 0){
    box.innerHTML = '<div class="ss-empty">No match — check spelling, or type your ID (e.g. HYD-039).</div>';
  } else {
    box.innerHTML = matches.map(s =>
      `<div class="ss-row" onmousedown="selectStaff('${type}','${s.id}')"><b>${s.name}</b> <span class="sid">${s.id} · ${s.branch}</span></div>`
    ).join('');
  }
  box.classList.remove('hidden');
}
function selectStaff(type, id){
  const s = (STAFF_LIST[type]||[]).find(x => x.id === id);
  if(!s) return;
  STAFF_SEL[type] = id;
  const input = document.getElementById(type==='regular'?'rs-search':'es-search');
  input.value = `${s.name} (${s.id})`;
  input.classList.add('ss-picked');
  hideStaffResults(type);
  const pin = document.getElementById(type==='regular'?'rs-pin':'es-pin');
  if(pin) pin.focus();
}
function hideStaffResults(type){
  const box = document.getElementById(type==='regular'?'rs-results':'es-results');
  if(box) box.classList.add('hidden');
}
async function loadLoginDropdowns(){
  const statusEl = document.getElementById('login-status');
  if(statusEl) statusEl.textContent = 'Connecting to server...';
  const admins = await sbGet('admins','select=id,name,branch,role&order=id.asc');
  const asel = document.getElementById('adm-sel');
  asel.innerHTML = '<option value="">— select —</option>';
  const shownIds = new Set();
  Object.values(HARDCODED_ADMINS).forEach(a => {
    shownIds.add(a.id);
    asel.innerHTML += `<option value="${a.id}">${a.name} — ${a.branch}</option>`;
  });
  if(Array.isArray(admins)){
    admins.forEach(a => {
      if(shownIds.has(a.id)) return;
      const roleLbl = a.role==='Branch Manager' ? ' (Manager)' : '';
      asel.innerHTML += `<option value="${a.id}">${a.name} — ${a.branch}${roleLbl}</option>`;
      shownIds.add(a.id);
    });
  }
  const rstaff = await sbGet('staff','select=id,name,branch&type=eq.regular&active=eq.true&order=name.asc');
  STAFF_LIST.regular = Array.isArray(rstaff) ? rstaff : [];
  const estaff = await sbGet('staff','select=id,name,branch&type=eq.event&active=eq.true&order=name.asc');
  STAFF_LIST.event = Array.isArray(estaff) ? estaff : [];
  const statusEl2 = document.getElementById('login-status');
  if(statusEl2){
    if(Array.isArray(admins) && admins.length > 0){
      statusEl2.style.color='var(--green)';
      statusEl2.textContent = '● Connected to cloud ✓';
    } else {
      statusEl2.style.color='var(--red)';
      statusEl2.textContent = '● Connection failed. Check internet.';
    }
  }
}

async function doAdminLogin(){
  const aid = document.getElementById('adm-sel').value;
  const pass = document.getElementById('adm-pass').value;
  if(!aid){toast('Select admin','er');return}
  // Try Supabase first (covers Branch Managers and any updated passwords)
  const admins = await sbGet('admins',`id=eq.${aid}&pass=eq.${encodeURIComponent(pass)}`);
  if(Array.isArray(admins) && admins.length > 0){
    CU = {...admins[0], userType:'admin'};
    launch();
  } else if(HARDCODED_ADMINS[aid] && HARDCODED_ADMINS[aid].pass === pass){
    // Fallback to hardcoded (updated passwords)
    CU = {...HARDCODED_ADMINS[aid], userType:'admin'};
    launch();
  } else {
    toast('Wrong password','er');
  }
}

  if(Array.isArray(staff) && staff.length > 0){
    CU = {...staff[0], userType:'staff'};

async function getRate(staffId, monthKey){
  const data = await sbGet('month_rates', `staff_id=eq.${staffId}&month_key=eq.${encodeURIComponent(monthKey)}&select=rate`);
  if(Array.isArray(data) && data.length > 0) return data[0].rate;
  const prev = await sbGet('month_rates', `staff_id=eq.${staffId}&select=rate,month_key&order=created_at.desc&limit=1`);
  if(Array.isArray(prev) && prev.length > 0) return prev[0].rate;
  const s = await sbGet('staff', `id=eq.${staffId}&select=rate`);
  return (Array.isArray(s) && s.length > 0) ? s[0].rate || 0 : 0;
}
async function getRateOut(staffId, monthKey){
  const data = await sbGet('month_rates', `staff_id=eq.${staffId}&month_key=eq.${encodeURIComponent(monthKey)}&select=rate_out`);
  if(Array.isArray(data) && data.length > 0 && data[0].rate_out != null && data[0].rate_out !== '') return Number(data[0].rate_out);
  const st = await sbGet('staff', `id=eq.${staffId}&select=rate_out`);
  if(Array.isArray(st) && st.length > 0 && st[0].rate_out != null && st[0].rate_out !== '') return Number(st[0].rate_out);
  return null;
}
// Returns the rupee amount for one attendance row, or null if an outstation
// rate has never been set for this staff (caller must ask the manager).
async function resolveRate(staffId, monthKey, tripType){
  if(tripType === 'outstation'){
    const ro = await getRateOut(staffId, monthKey);
    return (ro != null && ro > 0) ? ro : null;
  }
  return await getRate(staffId, monthKey);
}

async function addStaff(){
  const name = document.getElementById('ns-name').value.trim();
  const phone = document.getElementById('ns-phone').value.trim();
  const br = document.getElementById('ns-br').value;
  const role = document.getElementById('ns-role').value;
  const type = document.getElementById('ns-type').value;
  const rate = parseFloat(document.getElementById('ns-rate').value)||0;
  const pin = document.getElementById('ns-pin').value.trim();
  if(!name){toast('Name required','er');return}
  if(pin.length!==4||isNaN(Number(pin))){toast('PIN must be 4 digits','er');return}
  const brCode = br==='Vijayawada'?'VJA':br==='Hyderabad'?'HYD':'VSK';
  const pfx = type==='regular' ? brCode+'-R' : brCode+'-';
  const existing = await sbGet('staff', `id=like.${pfx}*&select=id`);
  const cnt = Array.isArray(existing) ? existing.length : 0;
  const newId = pfx + String(cnt+1).padStart(type==='regular'?2:3,'0');
  const obj = {id:newId,name,phone,role,type,branch:br,pin,active:true};
  if(type==='regular') obj.salary=rate; else obj.rate=rate;
  const res = await sbPost('staff', obj);
  if(Array.isArray(res) && res.length > 0){
    toast(name+' added as '+newId);
    ['ns-name','ns-phone','ns-pin','ns-rate'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    loadStaffTable(); loadLoginDropdowns();
  } else toast('Failed to add staff','er');
}

async function doResetAdmPw(id,name){
  const nw=document.getElementById('rap-new').value.trim();
  const cf=document.getElementById('rap-cf').value.trim();
  const msg=document.getElementById('rap-msg');
  msg.style.color='var(--red)';
  if(!nw){msg.textContent='Enter a new password.';return}
  if(nw.length<6){msg.textContent='Password must be at least 6 characters.';return}
  if(nw!==cf){msg.textContent='Passwords do not match.';return}
  // 'master' lives only in the hardcoded fallback — block resetting it here to avoid lockout confusion
  if(id==='master'){msg.textContent='Master password cannot be reset here. Use the hardcoded value in the file.';return}
  const res=await sbPatch('admins',`id=eq.${id}`,{pass:nw});
  if(Array.isArray(res)&&res.length>0){
    closeModal();
    toast('Password reset for '+name+' ✓');
  } else {
    msg.textContent='Reset failed. This account may only exist as a hardcoded fallback (not in the database).';
  }
}

async function changeMyPassword(){
  const cur=document.getElementById('cp-cur').value.trim();
  const nw=document.getElementById('cp-new').value.trim();
  const cf=document.getElementById('cp-cf').value.trim();
  const msg=document.getElementById('cp-msg');
  msg.style.color='var(--red)';
  if(CU.id==='master'){msg.textContent='Master password must be changed in the index.html file on GitHub.';return}
  if(!cur||!nw||!cf){msg.textContent='Please fill all three fields.';return}
  if(nw.length<6){msg.textContent='New password must be at least 6 characters.';return}
  if(nw!==cf){msg.textContent='New passwords do not match.';return}
  if(nw===cur){msg.textContent='New password must be different from the current one.';return}
  // Verify current password against the database
  const check=await sbGet('admins',`id=eq.${CU.id}&pass=eq.${encodeURIComponent(cur)}&select=id`);
  let currentOk = Array.isArray(check) && check.length>0;
  // Fallback: if account not yet in DB but matches hardcoded value
  if(!currentOk && HARDCODED_ADMINS[CU.id] && HARDCODED_ADMINS[CU.id].pass===cur){ currentOk=true; }
  if(!currentOk){msg.textContent='Current password is incorrect.';return}
  // Update in the database (upsert so hardcoded-only branch admins get a real DB row)
  const existing = await sbGet('admins',`id=eq.${CU.id}&select=id`);
  let res;
  if(Array.isArray(existing) && existing.length>0){
    res = await sbPatch('admins',`id=eq.${CU.id}`,{pass:nw});
  } else {
    res = await sbPost('admins',{id:CU.id,name:CU.name,branch:CU.branch,pass:nw,role:CU.role});
  }
  if(Array.isArray(res) && res.length>0){
    CU.pass = nw;
    msg.style.color='var(--green)';
    msg.textContent='✓ Password changed successfully. Use it next time you log in.';
    document.getElementById('cp-cur').value='';
    document.getElementById('cp-new').value='';
    document.getElementById('cp-cf').value='';
    toast('Password updated ✓');
  } else {
    msg.textContent='Update failed. Check your internet and try again.';
  }
}

// Approving FREEZES the rupee amount onto the row, so later rate changes
// never rewrite an already-approved month.
async function apprAtt(id){
  const rows = await sbGet('attendance',`id=eq.${id}&select=*`);
  const a = Array.isArray(rows) && rows[0];
  if(!a){toast('Record not found','er');return}
  const tt = a.trip_type==='outstation' ? 'outstation' : 'instation';
  const mk = mkkey(a.date);
  let rate = await resolveRate(a.staff_id, mk, tt);
  if(rate == null){
    const nm = (window.STAFF_BY_ID && window.STAFF_BY_ID[a.staff_id]?.name) || a.staff_id;
    const typed = prompt('No outstation rate is set for '+nm+'.\nEnter the outstation amount (₹) for this event:');
    if(typed === null) return;
    rate = parseFloat(typed) || 0;
    if(rate <= 0){toast('Invalid amount','er');return}
    if(confirm('Save ₹'+rate+' as '+nm+"'s default outstation rate?")){
      await sbPatch('staff',`id=eq.${a.staff_id}`,{rate_out:rate});
    }
  }
  await sbPatch('attendance',`id=eq.${id}`,{status:'approved',trip_type:tt,rate_applied:rate});
  toast('Approved ✓ ₹'+Number(rate).toLocaleString());
  reloadApprovals();
}

  if(!Array.isArray(rows)||!rows.length){toast('Nothing pending','info');return}
  toast('Approving '+rows.length+'...','info',4000);
  let done=0, skipped=0;
  for(const a of rows){
    const tt = a.trip_type==='outstation' ? 'outstation' : 'instation';
    const rate = await resolveRate(a.staff_id, mkkey(a.date), tt);

    done++;
  }
  toast('Approved '+done+(skipped?' · '+skipped+' skipped (outstation rate not set — approve those one by one)':'')+' ✓', skipped?'info':'ok', skipped?7000:3000);

}

    return `<tr>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="av av-r">${ini(name)}</div>${name}</div></td>
      <td>${c.date} <span style="color:var(--muted);font-size:11px">${day}</span>${isSunday(c.date)?'<span class="b ba" style="margin-left:4px;font-size:10px">SUN</span>':''}</td>

    const adj = travAdj(s.id);
    const pay = (s.salary||0)-ded+adj;
    regT+=pay; travNet+=adj;
    return {s,dw,wd,ea,ded,adj,pay};

    pay += adj;
    evtT+=pay; travNet+=adj;

  const grand = regT+evtT+extT;

    </div>
    <div class="sal-bd">

      <div class="sbd"><div class="sbd-v" style="color:var(--blue)">₹${evtT.toLocaleString()}</div><div class="sbd-l">Event Staff</div></div>
      <div class="sbd"><div class="sbd-v" style="color:var(--amber)">₹${extT.toLocaleString()}</div><div class="sbd-l">Outsourced</div></div>
      <div class="sbd"><div class="sbd-v" style="color:var(--gold)">₹${outT.toLocaleString()}</div><div class="sbd-l">✈ Outstation (${outCount} shifts)</div></div>
      <div class="sbd"><div class="sbd-v" style="color:${travNet<0?'var(--red)':'var(--green)'}">${travNet<0?'−':'+'}₹${Math.abs(travNet).toLocaleString()}</div><div class="sbd-l">Travel settlement${travPend?` · ⚠ ${travPend} bill(s) pending`:''}</div></div>
    </div>
  </div>
  <div class="ssep">Regular Staff</div>
  <div class="card"><div class="tw"><table><thead><tr><th>Name</th><th>Branch</th><th>Salary</th><th>Work Days</th><th>Worked</th><th>Extra Absent</th><th>Deduction</th><th>✈ Travel</th><th>Final Pay</th><th>Payment</th></tr></thead>

    <td>${s.branch}</td><td>₹${(s.salary||0).toLocaleString()}</td>

    <td style="font-weight:700;color:var(--gold)">₹${pay.toLocaleString()}</td>

  <div class="ssep">Event Staff</div>

// Per-person salary payment toggle (event & regular staff)
async function toggleSalaryPaid(staffId, monthKey, branch, current){
  const now = !current;
  const res = await sbUpsert('salary_paid',{
    id: staffId+'__'+monthKey,
    staff_id: staffId, month_key: monthKey, branch: branch||'',
    paid: now, paid_on: now ? new Date().toISOString() : null
  });
  if(Array.isArray(res) && res.length>0){
    toast(now ? 'Marked as Paid ✓' : 'Marked as Not Paid', now?'ok':'info');
    loadSalary();
  } else {
    console.error('salary_paid save failed:', res);
    const emsg = (res && res.message) ? res.message : 'unknown error';
    toast('Save failed — check the salary_paid table setup. ('+emsg+')','er',7000);
  }
}

async function pgReports(el){
  loading(el);
  // ── Build last 12 months list ──
  const last12 = [];
  const now = new Date();
  for(let i = 0; i < 12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    last12.push(mkkey(d.toISOString().split('T')[0]));
  }
  // ── Fetch months that actually have data ──
  const br = myBranch();
  const [attMonths, evtMonths, clockMonths] = await Promise.all([
    sbGet('attendance', (br?`branch=eq.${br}&`:'') + 'select=date'),
    sbGet('events',     (br?`branch=eq.${br}&`:'') + 'select=date'),
    sbGet('clocklog',   (br?`branch=eq.${br}&`:'') + 'select=date'),
  ]);
  // Build a Set of month keys that have real data
  const hasData = new Set();
  const addMonths = (rows) => {
    if(Array.isArray(rows)) rows.forEach(r => { if(r.date) hasData.add(mkkey(r.date)); });
  };
  addMonths(attMonths);
  addMonths(evtMonths);
  addMonths(clockMonths);
  // ── Also include any months from data older than 12 months ──
  const allDataMonths = new Set([...hasData]);
  last12.forEach(m => allDataMonths.delete(m)); // remove ones already in last12
  const extraMonths = [...allDataMonths].sort().reverse(); // older months
  const allCards = [
    {t:'Daily Report',  icon:'📅', sub:"Today's clock log + event attendance", type:'daily'},
    {t:'Monthly Salary',icon:'📆', sub:'Full salary sheet with all staff',      type:'monthly'},
    {t:'Event Report',  icon:'🎪', sub:'Attendance per event with GPS status',  type:'events'},
    {t:'Staff Master',  icon:'👥', sub:'All staff, roles, branches, rates',     type:'staff'},
  ];
  const cards = isManager() ? allCards.filter(c=>c.type==='events') : allCards;
  // Build dropdown options — last 12 months + any extra older months
  const buildOptions = (list) => list.map(m => {
    const hasD = hasData.has(m);
    return `<option value="${m}" ${hasD?'':'style="color:var(--muted2)"'}>${m}${hasD?' ●':' ○'}</option>`;
  }).join('');
  el.innerHTML = `
  <div class="ptitle">Excel Reports</div>
  <div class="psub">Download .xlsx reports — opens in Excel or Google Sheets.</div>
  <div class="info-box" style="margin-bottom:1rem">
    <b>● = Has data</b> &nbsp;|&nbsp; <b>○ = No data this month</b><br>
    All 12 months shown. Select any month and download.
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center">
    <div>
      <label style="margin-bottom:4px">Select Month</label>
      <select id="rpt-mo" style="min-width:200px">
        <optgroup label="Last 12 Months">
          ${buildOptions(last12)}
        </optgroup>
        ${extraMonths.length ? `<optgroup label="Older Records">${buildOptions(extraMonths)}</optgroup>` : ''}
      </select>
    </div>
    ${!myBranch()?`
    <div>
      <label style="margin-bottom:4px">Branch</label>
      <select id="rpt-br">
        <option value="">All Branches</option>
        ${BRANCHES.map(b=>`<option>${b}</option>`).join('')}
      </select>
    </div>`:''}
  </div>
  <div class="report-grid">
    ${cards.map(r=>`
    <div class="report-card" onclick="doExportReport('${r.type}')">
      <div class="rc-icon">${r.icon}</div>
      <div class="rc-title">${r.t}</div>
      <div class="rc-sub">${r.sub}</div>
    </div>`).join('')}
  </div>
  <div class="info-box">
    📌 All reports download as .xlsx files.<br>
    Selfie photos noted as YES/NO. GPS coordinates included.
  </div>`;
}
async function doExportReport(type){
  if(isManager() && type!=='events'){toast('You can only download the Event Report','er');return}

      sbGet('outsourced',`date=gte.${yi}-${m2}-01&date=lte.${yi}-${m2}-${ld}${br?`&branch=eq.${br}`:''}&select=*`),
      sbGet('month_rates',`month_key=eq.${encodeURIComponent(mo)}&select=*`),
      sbGet('salary_paid',`month_key=eq.${encodeURIComponent(mo)}${br?`&branch=eq.${br}`:''}&select=*`)
    ]);
    const staff=Array.isArray(staffData)?staffData:[];
    const att=Array.isArray(attData)?attData:[];
    const clocks=Array.isArray(clockData)?clockData:[];
    const ext=Array.isArray(extData)?extData:[];
    const paidMapX={};if(Array.isArray(paidData))paidData.forEach(p=>{paidMapX[p.staff_id]=p.paid===true;});
    const rMap={};if(Array.isArray(ratesData))ratesData.forEach(r=>rMap[r.staff_id]=r.rate);
    let rT=0,eT=0,xT=ext.reduce((s,o)=>s+o.amount,0);
    staff.filter(s=>s.type==='regular').forEach(s=>{const dw=clocks.filter(c=>c.staff_id===s.id).length;const ea=Math.max(0,wd-4-dw);const ded=Math.round(ea*(s.salary||0)/wd);rT+=(s.salary||0)-ded;});
    staff.filter(s=>s.type==='event').forEach(s=>{const rate=rMap[s.id]!==undefined?rMap[s.id]:s.rate||0;eT+=att.filter(a=>a.staff_id===s.id).length*rate;});
    const sumRows=[['REBELZ EVENTS & PROMOTIONS'],['Monthly Salary — '+mo+(br?' · '+br:' · All Branches')],['Generated',new Date().toLocaleString()],[''],
      ['Category','Amount (₹)'],['Regular Staff',rT],['Event Staff',eT],['Outsourced',xT],['GRAND TOTAL',rT+eT+xT],[''],['Working Days',wd],['Sundays',getSundays(yi,mi)],['Paid Offs','4 per staff']];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sumRows),'Summary');
    const rRows=[['Staff ID','Name','Role','Branch','Salary','Work Days','Worked','Extra Absent','Deduction','Final Pay','Payment Status']];
    staff.filter(s=>s.type==='regular').forEach(s=>{const dw=clocks.filter(c=>c.staff_id===s.id).length;const ea=Math.max(0,wd-4-dw);const ded=Math.round(ea*(s.salary||0)/wd);rRows.push([s.id,s.name,s.role,s.branch,s.salary||0,wd,dw,ea,ded,(s.salary||0)-ded,paidMapX[s.id]?'PAID':'UNPAID']);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rRows),'Regular Staff');
    const eRows=[['Staff ID','Name','Role','Branch','Rate','Events Attended','Total Pay','Payment Status']];
    staff.filter(s=>s.type==='event').forEach(s=>{const rate=rMap[s.id]!==undefined?rMap[s.id]:s.rate||0;const cnt=att.filter(a=>a.staff_id===s.id).length;eRows.push([s.id,s.name,s.role,s.branch,rate,cnt,cnt*rate,paidMapX[s.id]?'PAID':'UNPAID']);});

    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Event Report');
  }
  XLSX.writeFile(wb,`Rebelz_${type}_${(br||'All').replace(/\s/g,'_')}_${mo.replace(' ','_')}.xlsx`);

      if(a.rate_applied!=null && a.rate_applied!=='') return Number(a.rate_applied);
      const st=sById[a.staff_id]||{}; const rm=rMap[a.staff_id]||{};
      const base=(rm.rate!=null?Number(rm.rate):(st.rate||0))||0;
      const ro=rm.rate_out!=null?Number(rm.rate_out):(st.rate_out!=null?Number(st.rate_out):null);
      return a.trip_type==='outstation' ? (ro!=null?ro:base) : base;
    };
    const regular=staff.filter(s=>s.type==='regular').map(s=>({
      id:s.id,name:s.name,role:s.role,branch:s.branch,salary:s.salary||0,
      workdays:wd, worked:clocks.filter(c=>c.staff_id===s.id).length,
      status:paidMap[s.id]?'PAID':'UNPAID'
    }));
    const event=staff.filter(s=>s.type==='event').map(s=>{
      const rows=att.filter(a=>a.staff_id===s.id);
      const total=rows.reduce((t,a)=>t+rowAmt(a),0);
      const rm=rMap[s.id]||{};
      const base=(rm.rate!=null?Number(rm.rate):s.rate)||0;
      // blended rate keeps the sheet's =rate*events formula live AND correct
      // when a staff worked a mix of instation and outstation events
      const eff = rows.length ? Math.round((total/rows.length)*100)/100 : base;
      return {
        id:s.id,name:s.name,role:s.role,branch:s.branch,
        rate:eff, events:rows.length,
        status:paidMap[s.id]?'PAID':'UNPAID'
      };
    });
    const outsourced=ext.map(o=>({id:o.id,name:o.name,role:o.role,branch:o.branch,date:o.date,amount:o.amount||0,paid:o.paid?'PAID':'UNPAID'}));
    const attendance=att.map(a=>({sid:a.staff_id,date:a.date,time:a.time||'',role:a.role,branch:a.branch,status:a.status,lat:a.gps_lat,lng:a.gps_lng,photo:a.photo_url?'YES':'NO',name:nameById[a.staff_id]||'',trip:a.trip_type==='outstation'?'OUTSTATION':'INSTATION',city:a.city||'',rate:rowAmt(a)}));
    const input={
      monthLabel:mo, branch:br||'',
      generated:'Generated: '+new Date().toLocaleString('en-GB',{day:'numeric',month:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true})+'  ·  Figures update automatically from Regular Staff, Event Staff and Outsourced sheets',
      assumptions:{workdays:wd, sundays:getSundays(yi,mi), paidoffs:4},
      regular, event, outsourced, attendance
    };
    const wb=RebelzReport.buildWorkbook(ExcelJS,input);
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`Rebelz_Monthly_${(br||'All').replace(/\s/g,'_')}_${mo.replace(' ','_')}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    toast('Report downloaded ✓');
  }catch(e){ console.error(e); toast('Report failed: '+(e.message||e),'er'); }
}

(function (root) {

      tvals.forEach((v,c)=>{const cell=att.getCell(tr,13+c);if(v!=null)cell.value=v;cell.fill=fill(PURPLEHDR);cell.font=F({bold:true,color:{argb:NAVY}});});

    buildDashboard(dash, d, A, branchLbl);

    function buildDashboard(dash, d, A, branchLbl){
      dash.getColumn(1).width=31.7; dash.getColumn(2).width=18.3;
      for(let c=3;c<=8;c++)dash.getColumn(c).width=13;
      const genStr=d.generated||('Generated: '+new Date().toLocaleString()+'  ·  Figures update automatically from Regular Staff, Event Staff and Outsourced sheets');

      c1.fill=fill(NAVY); c1.font=F({bold:true,size:20,color:{argb:WHITE}}); c1.alignment={horizontal:'left',vertical:'middle'};
      dash.getRow(1).height=34;
      dash.mergeCells('A2:H2'); const c2=dash.getCell('A2');
      c2.value='Monthly Salary — '+(d.monthLabel||'')+branchLbl;
      c2.fill=fill(BLUE1); c2.font=F({color:{argb:WHITE}}); c2.alignment={vertical:'middle'};
      dash.mergeCells('A3:H3'); const c3=dash.getCell('A3');
      c3.value=genStr; c3.font=F({size:9,color:{argb:GREY2}}); c3.alignment={vertical:'middle'};
      const kpis=[['TOTAL PAYROLL (₹)',BLUE2,'B13',RUP],['PAID OUT (₹)',GREEN,'E13',RUP],['OUTSTANDING (₹)',RED,'F13',RUP],['PEOPLE ON PAYROLL',PURPLE,null,NUM]];
      dash.getRow(6).height=30;
      kpis.forEach((k,idx)=>{
        const startCol=1+idx*2;
        dash.mergeCells(5,startCol,5,startCol+1); dash.mergeCells(6,startCol,6,startCol+1);
        const h=dash.getCell(5,startCol); h.value=k[0]; h.fill=fill(k[1]); h.font=F({bold:true,size:10,color:{argb:WHITE}}); h.alignment={horizontal:'center'};
        const v=dash.getCell(6,startCol);
        v.value=k[2]?{formula:k[2]}:{formula:'D10+D11+SUMPRODUCT((Outsourced!$A$2:$A$200<>"")/COUNTIF(Outsourced!$B$2:$B$200,Outsourced!$B$2:$B$200&""))'};

      s8.value='PAYROLL BY CATEGORY'; s8.fill=fill(NAVY); s8.font=F({bold:true,size:11,color:{argb:WHITE}});
      ['Category','Amount (₹)','% of Total','Headcount / Entries','Paid (₹)','Unpaid (₹)'].forEach((h,i)=>{const c=dash.getCell(9,1+i);c.value=h;c.fill=fill(HDRBLUE);c.font=F({bold:true});c.alignment={horizontal:'center'};});

        dash.getCell(r,6).value={formula:`B${r}-E${r}`}; dash.getCell(r,6).numFmt=RUP;
        for(let c=1;c<=6;c++)dash.getCell(r,c).font=F({});
      });
      dash.getCell(13,1).value='GRAND TOTAL';
      ['B','C','D','E','F'].forEach((col,i)=>{const cc=2+i; dash.getCell(13,cc).value={formula:`SUM(${col}10:${col}12)`}; dash.getCell(13,cc).numFmt=(cc===4?NUM:(cc===3?PCT:RUP));});
      styleRow(dash,13,1,6,{fill:fill(NAVY),font:F({bold:true,color:{argb:WHITE}})});
      dash.getCell(13,4).numFmt=NUM; dash.getCell(13,3).numFmt=PCT;
      dash.mergeCells('A15:H15'); const s15=dash.getCell('A15');
      s15.value='PAYROLL ASSUMPTIONS (edit the blue cells)'; s15.fill=fill(NAVY); s15.font=F({bold:true,size:11,color:{argb:WHITE}});
      [['Working Days in Month',A.workdays,'Used for per-day rate on Regular Staff'],['Sundays',A.sundays,''],['Paid Offs per Regular Staff',A.paidoffs,'Days paid even if absent']].forEach((a,i)=>{

        if(a[2]){dash.getCell(r,3).value=a[2]; dash.getCell(r,3).font=F({color:{argb:GREY}});}

      dash.mergeCells('A20:H20'); const s20=dash.getCell('A20');
      s20.value='OUTSOURCED SPEND BY PERSON'; s20.fill=fill(NAVY); s20.font=F({bold:true,size:11,color:{argb:WHITE}});
      ['Name','Amount (₹)','Shifts','Unpaid (₹)'].forEach((h,i)=>{const c=dash.getCell(21,1+i);c.value=h;c.fill=fill(HDRBLUE);c.font=F({bold:true});c.alignment={horizontal:'center'};});
      dash.getRow(21).height=16.2;
      const uniqNames=[...new Set(d.outsourced.map(o=>o.name))].sort((a,b)=>a.localeCompare(b));
      uniqNames.forEach((nm,i)=>{
        const r=22+i;
        dash.getCell(r,1).value=nm;
        dash.getCell(r,2).value={formula:`IF($A${r}="","",SUMIFS(Outsourced!$F$2:$F$500,Outsourced!$B$2:$B$500,$A${r},Outsourced!$A$2:$A$500,"EXT-*"))`}; dash.getCell(r,2).numFmt=RUP;
        dash.getCell(r,3).value={formula:`IF($A${r}="","",COUNTIFS(Outsourced!$B$2:$B$500,$A${r},Outsourced!$A$2:$A$500,"EXT-*"))`}; dash.getCell(r,3).numFmt=NUM;
        dash.getCell(r,4).value={formula:`IF($A${r}="","",SUMIFS(Outsourced!$F$2:$F$500,Outsourced!$B$2:$B$500,$A${r},Outsourced!$G$2:$G$500,"UNPAID",Outsourced!$A$2:$A$500,"EXT-*"))`}; dash.getCell(r,4).numFmt=RUP;
        for(let c=1;c<=4;c++)dash.getCell(r,c).font=F({});
      });
    }
  }

  function computeRollup(d){
    const dayKey=(s)=>String(s).slice(0,10);
    const dates=new Set();
    d.attendance.forEach(a=>dates.add(dayKey(a.date)));
    d.outsourced.forEach(o=>dates.add(dayKey(o.date)));
    const sorted=[...dates].filter(Boolean).sort();
    return sorted.map(day=>{
      const atts=d.attendance.filter(a=>dayKey(a.date)===day);
      const outs=d.outsourced.filter(o=>dayKey(o.date)===day);
      const venues=new Set();
      atts.forEach(a=>{
        if(a.lat==null||a.lng==null||a.lat===''||a.lng==='') venues.add('no-gps');
        else venues.add(Number(a.lat).toFixed(2)+','+Number(a.lng).toFixed(2));
      });
      const eventsHeld=Math.max(venues.size, atts.length?1:0, outs.length?1:0);
      const eventCost=atts.reduce((s,a)=>s+(a.rate||0),0);
      const outCost=outs.reduce((s,o)=>s+(o.amount||0),0);
      return {date:day,eventsHeld,staffCount:atts.length,staffIds:atts.map(a=>a.sid).join(', '),
        names:atts.map(a=>a.name).filter(Boolean).join(', '),eventCost,outCrew:outs.length,
        outNames:outs.map(o=>o.name).join(', '),outCost,totalCrew:atts.length+outs.length,totalCost:eventCost+outCost};
    });
  }

  root.RebelzReport={buildWorkbook,computeRollup};
})(window);

function startCam(){
  document.getElementById('cam-ph').style.display='none';
  document.getElementById('cam-ac').style.display='block';
  const v=document.getElementById('cam-video');v.style.display='block';
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
    .then(stream=>{_camStream=stream;v.srcObject=stream;v.play();})
    .catch(()=>{toast('Allow camera access in browser settings','er');document.getElementById('cam-ph').style.display='block';document.getElementById('cam-ac').style.display='none';});
}
function capPhoto(){
  const v=document.getElementById('cam-video');const c=document.getElementById('cam-canvas');
  c.width=300;c.height=300;
  const ctx=c.getContext('2d');
  const sz=Math.min(v.videoWidth,v.videoHeight);
  ctx.drawImage(v,(v.videoWidth-sz)/2,(v.videoHeight-sz)/2,sz,sz,0,0,300,300);
  c.toBlob(blob=>{
    window._photoBlob=blob;
    window._photo=URL.createObjectURL(blob);
    stopCam();
    document.getElementById('photo-img').src=window._photo;
    document.getElementById('photo-prev').style.display='block';
    document.getElementById('cam-ph').style.display='none';
    document.getElementById('cam-ac').style.display='none';
    toast('Selfie captured ✓');
  },'image/jpeg',0.7);
}
function retakeP(){window._photo=null;window._photoBlob=null;document.getElementById('photo-prev').style.display='none';document.getElementById('cam-ph').style.display='block';}
function stopCam(){if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}document.getElementById('cam-video').style.display='none';}
function getGPS(){
  const s=document.getElementById('gps-s');const btn=document.getElementById('gps-btn');
  s.innerHTML='<span style="color:var(--amber)">Getting location...</span>';btn.textContent='...';btn.disabled=true;
  if(!navigator.geolocation){s.innerHTML='<span style="color:var(--red)">GPS not supported</span>';btn.textContent='Retry';btn.disabled=false;return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude.toFixed(6),lng=pos.coords.longitude.toFixed(6),acc=Math.round(pos.coords.accuracy);
    window._gps={lat,lng,acc};
    s.innerHTML=`<span style="color:var(--green)">✓ ${lat}, ${lng} (±${acc}m)</span>`;
    btn.textContent='✓ Done';btn.style.background='var(--green-dim)';btn.style.color='var(--green)';
    document.getElementById('gps-link-wrap').style.display='block';
    document.getElementById('gps-link').href=`https://www.google.com/maps?q=${lat},${lng}`;
  },()=>{s.innerHTML='<span style="color:var(--red)">Failed. Allow location access.</span>';btn.textContent='Retry';btn.disabled=false;},{timeout:15000,enableHighAccuracy:true});
}

// ═══════════════════════════════════════════════════
// TRAVEL & ADVANCES  (travel_ledger)
//   kind='advance'  -> company cash handed to staff (approved on entry)
//   kind='expense'  -> a bill the staff spent (pending until approved)
//   balance = approved advances − approved expenses
//     positive -> staff is HOLDING company money  -> minus from salary
//     negative -> staff spent his OWN money       -> plus to salary
// ═══════════════════════════════════════════════════
const TL_CATS = ['Travel','Food','Accommodation','Other'];
function tlBalance(rows){
  let adv=0, exp=0, pend=0;
  (rows||[]).forEach(r=>{
    const amt = Number(r.amount)||0;
    if(r.kind==='advance' && r.status==='approved') adv += amt;
    else if(r.kind==='expense' && r.status==='approved') exp += amt;
    else if(r.kind==='expense' && r.status==='pending') pend += amt;
  });
  return {adv, exp, pend, bal: adv-exp};
}
function tlBalLabel(bal){
  if(bal > 0) return `<span style="color:var(--red);font-weight:700">₹${bal.toLocaleString()} holding</span>`;
  if(bal < 0) return `<span style="color:var(--green);font-weight:700">₹${Math.abs(bal).toLocaleString()} to pay</span>`;
  return '<span style="color:var(--muted)">Settled</span>';
}
// If the month of this date is already locked, push the entry to the
// current month instead — a late bill must never re-open a closed month.
async function tlMonthKey(date, branch){
  const mk = mkkey(date);
  const lock = await sbGet('salary_lock',`month_key=eq.${encodeURIComponent(mk)}&select=id`);
  if(Array.isArray(lock) && lock.length > 0){
    toast('That month is locked — entry moved to '+mkkey(today()),'info',6000);
    return mkkey(today());
  }
  return mk;
}
// Compress a bill photo (keeps text readable) -> window._tlBill (Blob)
function tlPickBill(input){
  const file = input.files && input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max=1000; let w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(bl=>{ window._tlBill = bl; }, 'image/jpeg', 0.8);
      const pv=document.getElementById('tl-bill-img');
      if(pv){ pv.src=c.toDataURL('image/jpeg',0.7); pv.style.display='block'; }
      const ok=document.getElementById('tl-bill-ok'); if(ok) ok.style.display='block';
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(file);
}

async function tlEditAmt(id,cur){
  const t=prompt('Correct the bill amount (₹):', cur);
  if(t===null)return;
  const v=parseFloat(t)||0;
  if(v<=0){toast('Invalid amount','er');return}
  await sbPatch('travel_ledger',`id=eq.${id}`,{amount:v});
  toast('Amount updated to ₹'+v.toLocaleString());
  pgTravel(document.getElementById('mc'));
}
async function tlDelete(id){ if(!confirm('Delete this entry permanently?'))return; await sbDelete('travel_ledger',`id=eq.${id}`); toast('Deleted'); pgTravel(document.getElementById('mc')); }

// PAY HISTORY (Staff — event & regular, month by month)
// ═══════════════════════════════════════════════════
async function pgMyHistory(el){
  loading(el);
  const s = CU;
  const isEvent = s.type==='event';
  const [recs, rates, locks] = await Promise.all([
    isEvent
      ? sbGet('attendance',`staff_id=eq.${s.id}&status=eq.approved&select=date&limit=1000`)
      : sbGet('clocklog',`staff_id=eq.${s.id}&status=eq.complete&select=date&limit=1000`),
    isEvent ? sbGet('month_rates',`staff_id=eq.${s.id}&select=month_key,rate`) : Promise.resolve([]),
    sbGet('salary_paid',`staff_id=eq.${s.id}&paid=eq.true&select=month_key`)
  ]);
  // Count records per month
  const byMonth = {};
  (Array.isArray(recs)?recs:[]).forEach(r=>{ if(r.date){ const k=mkkey(r.date); byMonth[k]=(byMonth[k]||0)+1; } });
  const thisMk = mkkey(today());
  const now = new Date();
  const lastMk = mkkey(new Date(now.getFullYear(), now.getMonth()-1, 1).toISOString().split('T')[0]);
  if(!(thisMk in byMonth)) byMonth[thisMk]=0;
  // Rates + paid status
  const ratesMap = {};
  (Array.isArray(rates)?rates:[]).forEach(r=>ratesMap[r.month_key]=r.rate);
  const paidSet = new Set();
  (Array.isArray(locks)?locks:[]).forEach(p=>{ if(p.month_key) paidSet.add(p.month_key); });
  const isPaid = mk => paidSet.has(mk);
  // Per-month calc
  function calc(mk){
    const cnt = byMonth[mk]||0;
    if(isEvent){
      const rate = ratesMap[mk]!==undefined ? ratesMap[mk] : (s.rate||0);
      return {cnt, rate, pay:cnt*rate};
    } else {
      const dd = new Date(mk+' 1');
      const wd = getWorkDays(dd.getFullYear(), dd.getMonth());
      const ea = Math.max(0, wd-4-cnt);
      const ded = Math.round(ea*(s.salary||0)/wd);
      return {cnt, wd, ded, pay:(s.salary||0)-ded};
    }
  }
  const months = Object.keys(byMonth).sort((a,b)=>new Date(b+' 1')-new Date(a+' 1'));
  const thisC = calc(thisMk);
  const lastC = calc(lastMk);
  const totalEarned = months.reduce((sum,mk)=>sum+calc(mk).pay,0);
  const totalPaid = months.filter(mk=>isPaid(mk)).reduce((sum,mk)=>sum+calc(mk).pay,0);
  const unitLbl = isEvent?'events':'days';
  el.innerHTML = `<div class="ptitle">Pay History</div>
  <div class="psub">${s.name} · ${s.role} · ${s.branch}</div>
  <div class="sgrid">
    <div class="stat"><div class="sv">${thisC.cnt}</div><div class="sl">This Month (${unitLbl})</div></div>
    <div class="stat"><div class="sv" style="color:var(--gold)">₹${thisC.pay.toLocaleString()}</div><div class="sl">This Month Pay</div></div>
    <div class="stat"><div class="sv">${lastC.cnt}</div><div class="sl">Last Month (${unitLbl})</div></div>
    <div class="stat"><div class="sv" style="color:${isPaid(lastMk)?'var(--green)':'var(--amber)'}">₹${lastC.pay.toLocaleString()}</div><div class="sl">Last Month ${isPaid(lastMk)?'· Paid ✓':'· Pending'}</div></div>
  </div>
  <div class="sal-hero">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.75rem">
      <div><div class="sal-total">₹${totalEarned.toLocaleString()}</div><div class="sal-lbl">Total earned (all time)</div></div>
      <div style="text-align:right"><div class="sal-total" style="font-size:24px;color:var(--green)">₹${totalPaid.toLocaleString()}</div><div class="sal-lbl">Received / paid so far</div></div>
    </div>
  </div>
  <div class="card"><div class="ctitle">Month-by-Month</div><div class="tw">
    <table><thead><tr><th>Month</th><th>${isEvent?'Events':'Days Worked'}</th>${isEvent?'<th>Rate</th>':'<th>Salary</th><th>Deduction</th>'}<th>${isEvent?'Earned':'Net Pay'}</th><th>Status</th></tr></thead>
    <tbody>${months.map(mk=>{
      const c=calc(mk);
      const paid=isPaid(mk);
      return `<tr>
        <td style="font-weight:500">${mk}${mk===thisMk?' <span class="b bgold" style="font-size:10px">Current</span>':''}</td>
        <td style="font-weight:600">${c.cnt}</td>
        ${isEvent?`<td>₹${(c.rate||0).toLocaleString()}</td>`:`<td>₹${(s.salary||0).toLocaleString()}</td><td style="color:${c.ded>0?'var(--red)':'var(--muted)'}">${c.ded>0?'−₹'+c.ded.toLocaleString():'—'}</td>`}
        <td style="font-weight:700;color:var(--gold)">₹${c.pay.toLocaleString()}</td>
        <td><span class="b ${paid?'bg':'ba'}">${paid?'Paid ✓':'In progress'}</span></td>
      </tr>`;
    }).join('')||'<tr><td colspan="'+(isEvent?5:6)+'" class="empty">No history yet</td></tr>'}</tbody></table>
  </div></div>
  <div class="info-box">🗓 <b>Paid ✓</b> = admin has marked your salary paid for that month. <b>In progress</b> = not paid yet. Current-month amounts may change as more attendance is added.</div>`;
}
