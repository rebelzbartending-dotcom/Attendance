<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebelz Attendance System</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#E8A020;--gold-l:#F5C842;--gold-dim:rgba(232,160,32,.15);
  --dk:#0D0D0D;--dk2:#161616;--dk3:#1E1E1E;--dk4:#282828;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --text:#F0EDE8;--muted:#787672;--muted2:#555;
  --green:#27AE60;--green-dim:rgba(39,174,96,.15);
  --red:#E74C3C;--red-dim:rgba(231,76,60,.15);
  --amber:#F39C12;--amber-dim:rgba(243,156,18,.15);
  --blue:#2E86C1;--blue-dim:rgba(46,134,193,.15);
  --purple:#8E44AD;--purple-dim:rgba(142,68,173,.15);
  --ff:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dk);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh}
.hidden{display:none!important}
input,select,textarea{font-family:var(--fb);font-size:13px;color:var(--text);background:var(--dk3);border:1px solid var(--border2);border-radius:9px;padding:9px 13px;outline:none;transition:border .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--dk3)}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:5px}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,rgba(232,160,32,.18) 0%,transparent 55%),var(--dk)}
.lbox{background:var(--dk2);border:1px solid var(--border2);border-radius:22px;padding:2.5rem 2rem;width:100%;max-width:370px}
.llogo{font-family:var(--ff);font-size:30px;font-weight:800;color:var(--gold);letter-spacing:-1.5px;text-align:center}
.lsub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:2rem;margin-top:3px}
.ltabs{display:flex;background:var(--dk3);border-radius:11px;padding:4px;margin-bottom:1.5rem;gap:4px}
.ltab{flex:1;padding:8px;border-radius:8px;border:none;background:none;color:var(--muted);font-family:var(--fb);font-size:13px;cursor:pointer;transition:all .2s}
.ltab.on{background:var(--gold);color:var(--dk);font-weight:600}
.frow{margin-bottom:13px}
.btn-gold{width:100%;padding:12px;background:var(--gold);color:var(--dk);border:none;border-radius:11px;font-family:var(--ff);font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn-gold:hover{background:var(--gold-l);transform:translateY(-1px)}
.lhint{text-align:center;font-size:11px;color:var(--muted);margin-top:.75rem}
.lhint b{color:var(--gold)}

/* SHELL */
#app{display:flex;min-height:100vh}
.sidebar{width:230px;flex-shrink:0;background:var(--dk2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.25rem 0;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
.slogo{font-family:var(--ff);font-size:19px;font-weight:800;color:var(--gold);padding:0 1.25rem 1rem;border-bottom:1px solid var(--border);letter-spacing:-.5px}
.slogo span{display:block;font-size:9px;font-weight:400;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-top:2px}
.suser{padding:.75rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:.5rem}
.su-name{font-size:13px;font-weight:600}
.su-role{font-size:11px;color:var(--muted);margin-top:2px}
.su-id{font-size:11px;color:var(--gold);font-family:monospace;margin-top:2px}
.su-branch{font-size:11px;color:var(--amber);margin-top:1px}
nav{flex:1;padding:0 .6rem;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left}
.ni:hover{background:var(--dk3);color:var(--text)}
.ni.on{background:var(--gold-dim);color:var(--gold)}
.ni .ic{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600}
.nsep{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.5px;padding:8px 11px 3px;font-weight:500}
.sbot{padding:.75rem 1.25rem;border-top:1px solid var(--border)}
.btnout{width:100%;padding:8px;background:var(--dk3);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s;font-family:var(--fb)}
.btnout:hover{color:var(--red);border-color:rgba(231,76,60,.4)}

/* MAIN */
.main{margin-left:230px;flex:1;padding:1.5rem;max-width:100%}
.page{display:none}
.page.on{display:block}
.ptitle{font-family:var(--ff);font-size:22px;font-weight:700;letter-spacing:-.5px}
.psub{color:var(--muted);font-size:13px;margin-top:3px;margin-bottom:1.5rem}

/* CARDS */
.card{background:var(--dk2);border:1px solid var(--border);border-radius:16px;padding:1.25rem;margin-bottom:1rem}
.ctitle{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:1rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem}
.stat{background:var(--dk3);border-radius:12px;padding:1rem}
.sv{font-family:var(--ff);font-size:24px;font-weight:700;color:var(--gold)}
.sl{font-size:12px;color:var(--muted);margin-top:3px}

/* BADGES */
.b{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px}
.bg{background:var(--green-dim);color:var(--green)}
.br{background:var(--red-dim);color:var(--red)}
.ba{background:var(--amber-dim);color:var(--amber)}
.bb{background:var(--blue-dim);color:var(--blue)}
.bp{background:var(--purple-dim);color:var(--purple)}
.bgold{background:var(--gold-dim);color:var(--gold)}

/* BTNS */
.btn{padding:8px 18px;border-radius:9px;border:1px solid var(--border2);background:var(--dk3);color:var(--text);font-family:var(--fb);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--dk4)}
.btn-p{background:var(--gold);color:var(--dk);border-color:var(--gold);font-weight:600}
.btn-p:hover{background:var(--gold-l)}
.btn-d{background:var(--red-dim);color:var(--red);border-color:rgba(231,76,60,.3)}
.btn-d:hover{background:rgba(231,76,60,.25)}
.btn-s{background:var(--green-dim);color:var(--green);border-color:rgba(39,174,96,.3)}
.btn-s:hover{background:rgba(39,174,96,.25)}
.btn-b{background:var(--blue-dim);color:var(--blue);border-color:rgba(46,134,193,.3)}
.btn-b:hover{background:rgba(46,134,193,.25)}
.bsm{padding:5px 11px;font-size:12px}
.grow{display:flex;gap:8px;flex-wrap:wrap;margin-top:.9rem;align-items:center}

/* FORM GRIDS */
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:11px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.av{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:var(--ff)}
.av-r{background:var(--green-dim);color:var(--green)}
.av-e{background:var(--blue-dim);color:var(--blue)}

/* CLOCK IN/OUT */
.clock-card{max-width:440px;margin:0 auto;background:var(--dk2);border:1px solid var(--border2);border-radius:22px;padding:2rem;text-align:center}
.clock-time{font-family:var(--ff);font-size:42px;font-weight:800;color:var(--gold);letter-spacing:-2px;margin:.5rem 0}
.clock-date{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.clock-status{border-radius:14px;padding:1rem;margin-bottom:1.5rem;font-size:14px}
.cs-in{background:var(--green-dim);border:1px solid rgba(39,174,96,.3);color:var(--green)}
.cs-out{background:var(--dk3);border:1px solid var(--border);color:var(--muted)}
.cs-done{background:var(--gold-dim);border:1px solid rgba(232,160,32,.3);color:var(--gold)}
.cs-incomplete{background:var(--amber-dim);border:1px solid rgba(243,156,18,.3);color:var(--amber)}
.big-btn{width:100%;padding:18px;border:none;border-radius:14px;font-family:var(--ff);font-size:17px;font-weight:800;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.bb-in{background:linear-gradient(135deg,var(--green),#2ECC71);color:#fff}
.bb-in:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(39,174,96,.3)}
.bb-out{background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--dk)}
.bb-out:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,160,32,.3)}

/* MARK PRESENT */
.mark-card{max-width:460px;margin:0 auto;background:var(--dk2);border:1px solid var(--border2);border-radius:22px;padding:2rem}
.mu{display:flex;align-items:center;gap:14px;background:var(--dk3);border-radius:12px;padding:1rem;margin-bottom:1.5rem}
.mu-info .name{font-family:var(--ff);font-size:16px;font-weight:700}
.mu-info .role{font-size:12px;color:var(--muted);margin-top:3px}
.mu-info .sid{font-size:12px;color:var(--gold);font-family:monospace;margin-top:2px}
.mark-btn{width:100%;padding:18px;border:none;border-radius:14px;font-family:var(--ff);font-size:18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--dk);transition:all .2s;margin-top:1rem}
.mark-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,160,32,.3)}

/* SALARY */
.sal-hero{background:linear-gradient(135deg,rgba(232,160,32,.18),rgba(232,160,32,.05));border:1px solid rgba(232,160,32,.3);border-radius:16px;padding:1.5rem;margin-bottom:1rem}
.sal-total{font-family:var(--ff);font-size:36px;font-weight:800;color:var(--gold)}
.sal-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.sal-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:1rem}
.sbd{background:rgba(0,0,0,.2);border-radius:10px;padding:.75rem}
.sbd-v{font-family:var(--ff);font-size:18px;font-weight:700}
.sbd-l{font-size:11px;color:var(--muted);margin-top:2px}

/* FILTER ROW */
.frow-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.frow-bar select,.frow-bar input{width:auto;min-width:120px}

/* DIVIDER */
.div{border:none;border-top:1px solid var(--border);margin:1rem 0}

/* SECTION SEP */
.ssep{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:2px;margin:1.2rem 0 .6rem;padding-left:2px}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--dk2);border:1px solid var(--border2);border-radius:13px;padding:11px 18px;font-size:13px;display:none;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:300px}
.toast.show{display:flex;align-items:center;gap:10px;animation:tin .3s ease}
.toast.ok{border-color:rgba(39,174,96,.5)}
.toast.er{border-color:rgba(231,76,60,.5)}
@keyframes tin{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--dk2);border:1px solid var(--border2);border-radius:18px;padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--ff);font-size:17px;font-weight:700;margin-bottom:1.25rem}

/* RESPONSIVE */
@media(max-width:700px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .fg2,.fg3,.fg4{grid-template-columns:1fr}
  .sal-breakdown{grid-template-columns:1fr 1fr}
  .sgrid{grid-template-columns:1fr 1fr}
  .mob-menu{display:flex!important}
}
.mob-menu{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--dk2);border:1px solid var(--border2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:18px;color:var(--gold)}
.empty{text-align:center;padding:2.5rem;color:var(--muted);font-size:13px}
.info-box{background:var(--dk3);border-radius:10px;padding:.75rem 1rem;font-size:12px;color:var(--muted);margin-bottom:1rem;border-left:3px solid var(--gold);line-height:1.6}
.row-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.row-item:last-child{border-bottom:none}
code{font-family:monospace;font-size:12px;color:var(--gold);background:var(--gold-dim);padding:2px 6px;border-radius:5px}
</style>

const GD_CLIENT_ID = '670954213827-7a80vcdk1slm7l43f78leh5fokgjl2jj.apps.googleusercontent.com';
const SHEET_NAME = 'Rebelz Attendance Data';
let gdToken = null;
let gdSheetId = localStorage.getItem('rz_sheet_id') || null;

function connectGDrive() {
  try {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GD_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file',
      callback: async (resp) => {
        if (resp.access_token) {
          gdToken = resp.access_token;
          const dot = document.getElementById('gd-dot');
          if(dot){dot.style.background='var(--green)';dot.title='Google Drive Connected';}
          toast('Google Drive connected ✓');
          await gdFindOrCreate();
        }
      }
    });
    client.requestAccessToken();
  } catch(e) {
    toast('Google Sign-in not ready. Refresh and try again.','er');
    console.log(e);
  }
}

async function gdFindOrCreate() {
  if (!gdToken) return;
  if (gdSheetId) { toast('Google Sheet linked ✓'); gdSync(); return; }
  try {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`, { headers: { Authorization: 'Bearer ' + gdToken } });
    const data = await res.json();
    if (data.files && data.files.length > 0) {
      gdSheetId = data.files[0].id;
      localStorage.setItem('rz_sheet_id', gdSheetId);
      toast('Connected to existing sheet ✓');
      gdSync();
    } else {
      await gdCreateSheet();
    }
  } catch(e) { console.log('GDrive find error', e); }
}

async function gdCreateSheet() {
  try {
    const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + gdToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ properties: { title: SHEET_NAME }, sheets: [
        { properties: { title: 'Staff' } },
        { properties: { title: 'Attendance' } },
        { properties: { title: 'ClockLog' } },
        { properties: { title: 'Outsourced' } },
        { properties: { title: 'Events' } }
      ]})
    });
    const data = await res.json();
    gdSheetId = data.spreadsheetId;
    localStorage.setItem('rz_sheet_id', gdSheetId);
    toast('Google Sheet created ✓');
    gdSync();
  } catch(e) { toast('Sheet creation failed','er'); console.log(e); }
}

async function gdSync() {
  if (!gdToken || !gdSheetId) { if(CU && CU.userType==='admin') toast('Connect Google Drive first','er'); return; }
  toast('Syncing to Google Drive...','info');
  try {
    const sheets = [
      { name: 'Staff', rows: [['ID','Name','Phone','Role','Type','Branch','Salary/Rate','Active'],
        ...DB.staff.map(s=>[s.id,s.name,s.phone||'',s.role,s.type,s.branch,s.type==='regular'?s.salary:s.rate,s.active?'Yes':'No'])] },
      { name: 'Attendance', rows: [['ID','Staff ID','Name','Event','Date','Time','Role','Branch','Status','GPS Lat','GPS Lng','GPS Acc','Has Photo'],
        ...DB.attendance.map(a=>{const s=DB.staff.find(x=>x.id===a.staffId);const e=DB.events.find(x=>x.id===a.eventId);
          return[a.id,a.staffId,s?.name||'',e?.name||'',a.date,a.time,a.role,a.branch,a.status,a.gps?.lat||'',a.gps?.lng||'',a.gps?.acc||'',a.photo?'YES':'NO'];})] },
      { name: 'ClockLog', rows: [['ID','Staff ID','Name','Branch','Date','Day','In','Out','Hours','Status'],
        ...DB.clocklog.map(c=>{const s=DB.staff.find(x=>x.id===c.staffId);
          let h='';if(c.inTime&&c.outTime){const[ih,im]=c.inTime.split(':').map(Number);const[oh,om]=c.outTime.split(':').map(Number);h=((oh*60+om-ih*60-im)/60).toFixed(2);}
          return[c.id,c.staffId,s?.name||'',c.branch,c.date,new Date(c.date).toLocaleDateString('en-IN',{weekday:'short'}),c.inTime,c.outTime||'',h,c.status];})] },
      { name: 'Outsourced', rows: [['ID','Name','Role','Event','Branch','Date','Amount','Phone','Paid'],
        ...DB.outsourced.map(o=>{const e=DB.events.find(x=>x.id===o.eventId);return[o.id,o.name,o.role,e?.name||'',o.branch,o.date,o.amount,o.phone||'',o.paid?'Yes':'No'];})] },
      { name: 'Events', rows: [['ID','Name','Date','Branch','Status','Total','Approved'],
        ...DB.events.map(e=>{const a=DB.attendance.filter(x=>x.eventId===e.id);return[e.id,e.name,e.date,e.branch,e.status,a.length,a.filter(x=>x.status==='approved').length];})] },
    ];
    for (const sh of sheets) {
      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${gdSheetId}/values/${encodeURIComponent(sh.name+'!A1')}?valueInputOption=RAW`, {
        method: 'PUT', headers: { Authorization: 'Bearer ' + gdToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: sh.rows })
      });
    }
    localStorage.setItem('rz_last_sync', new Date().toLocaleString());
    toast('✓ Synced to Google Drive');
  } catch(e) { toast('Sync failed','er'); console.log(e); }
}

function restoreJSON(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(confirm('Replace ALL data with backup?')){DB=d;save();toast('Restored ✓');showPage('dashboard');}}catch{toast('Invalid file','er');}};r.readAsText(file);
}

function ini(n){return n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substring(2,5)}
function mkkey(d){const dt=new Date(d);return dt.toLocaleString('default',{month:'long',year:'numeric'})}
function today(){return new Date().toISOString().split('T')[0]}
function nowtime(){return new Date().toTimeString().substring(0,5)}

function buildNav(){
  const nav=document.getElementById('mainnav');
  let items=[];
  if(CU.userType==='admin'){
    items=[
      {sep:'Overview'},{id:'dashboard',ic:'⬡',lbl:'Dashboard'},
      {sep:'Staff'},{id:'staffmgmt',ic:'◈',lbl:'Staff Management'},{id:'adminmgmt',ic:'◎',lbl:'Admin Logins',master:true},
      {sep:'Events'},{id:'events',ic:'◆',lbl:'Events'},{id:'outsourced',ic:'⬢',lbl:'Outsourced Staff'},
      {sep:'Attendance'},{id:'approvals',ic:'✦',lbl:'Approvals',badge:true},{id:'clocklog',ic:'◷',lbl:'Regular Staff Log'},
      {sep:'Payroll'},{id:'monthrates',ic:'◉',lbl:'Monthly Rates'},{id:'salary',ic:'₹',lbl:'Salary Sheet'},
    ];
  } else if(CU.type==='regular'){
    items=[{id:'clockin',ic:'◷',lbl:'Clock In / Out'},{id:'myatt',ic:'◈',lbl:'My Attendance'},{id:'mypay',ic:'◉',lbl:'My Pay'}];
  } else {
    items=[{id:'markpresent',ic:'✦',lbl:'Mark Present'},{id:'myrecords',ic:'◈',lbl:'My Records'},{id:'mypay',ic:'◉',lbl:'My Pay'}];
  }
  const pending=DB.attendance.filter(a=>a.status==='pending'&&(CU.branch==='ALL'||a.branch===CU.branch)).length;
  nav.innerHTML=items.map(item=>{
    if(item.sep) return `<div class="nsep">${item.sep}</div>`;
    if(item.master&&CU.id!=='master') return '';
    const badge=item.badge&&pending>0?`<span class="nbadge" id="appr-badge">${pending}</span>`:'';
    return `<button class="ni" data-page="${item.id}" onclick="showPage('${item.id}')">${item.ic?`<span class="ic">${item.ic}</span>`:''}<span>${item.lbl}</span>${badge}</button>`;
  }).join('');
}

}

function getSundaysInMonth(year,month){
  let count=0,d=new Date(year,month,1);
  while(d.getMonth()===month){if(d.getDay()===0)count++;d.setDate(d.getDate()+1);}
  return count;
}
function getWorkingDays(year,month){
  const total=new Date(year,month+1,0).getDate();
  return total-getSundaysInMonth(year,month);
}
function getEffectiveRate(staffId,monthKey){
  if(DB.monthRates[monthKey]&&DB.monthRates[monthKey][staffId]!==undefined) return DB.monthRates[monthKey][staffId];
  const keys=Object.keys(DB.monthRates).sort();
  for(let i=keys.length-1;i>=0;i--){
    if(DB.monthRates[keys[i]][staffId]!==undefined) return DB.monthRates[keys[i]][staffId];
  }
  const s=DB.staff.find(x=>x.id===staffId);
  return s?s.rate||0:0;
}
function isSunday(dateStr){return new Date(dateStr).getDay()===0}
function myBranch(){return CU.branch==='ALL'?null:CU.branch}

function addStaff(){
  const name=document.getElementById('ns-name').value.trim();
  const phone=document.getElementById('ns-phone').value.trim();
  const branch=document.getElementById('ns-branch').value;
  const role=document.getElementById('ns-role').value;
  const type=document.getElementById('ns-type').value;
  const rate=parseFloat(document.getElementById('ns-rate').value)||0;
  const pin=document.getElementById('ns-pin').value.trim();
  if(!name){toast('Name required','er');return}
  if(pin.length!==4||isNaN(Number(pin))){toast('PIN must be 4 digits','er');return}
  const brCode=branch==='Vijayawada'?'VJA':branch==='Hyderabad'?'HYD':'VSK';
  const pfx=type==='regular'?brCode+'-R':brCode+'-';
  const existing=DB.staff.filter(s=>s.id.startsWith(pfx)&&s.active).length;
  const newId=pfx+String(existing+1).padStart(type==='regular'?2:3,'0');
  DB.staff.push({id:newId,name,phone,role,type,branch,[type==='regular'?'salary':'rate']:rate,pin,active:true});
  save();toast(name+' added as '+newId);
  document.getElementById('ns-name').value='';document.getElementById('ns-pin').value='';document.getElementById('ns-rate').value='';
  renderStaffTbl();populateLoginSel('rs-sel','regular');populateLoginSel('es-sel','event');
}

function renderClockTbl(){
  const fb=document.getElementById('fcl-branch')?.value||myBranch()||'';
  const fm=document.getElementById('fcl-month')?.value||today().substring(0,7);
  const fs=document.getElementById('fcl-status')?.value||'';
  let list=[...DB.clocklog].filter(c=>c.date.startsWith(fm));
  if(fb)list=list.filter(c=>c.branch===fb);
  if(fs)list=list.filter(c=>c.status===fs);
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('clock-tbl');
  if(!list.length){el.innerHTML='<div class="empty">No clock records found.</div>';return}
  el.innerHTML=`<table><thead><tr><th>Name</th><th>Date</th><th>Branch</th><th>Clock In</th><th>Clock Out</th><th>Hours</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${list.map(c=>{
    const s=DB.staff.find(x=>x.id===c.staffId);
    let hours='-';
    if(c.inTime&&c.outTime){
      const [ih,im]=c.inTime.split(':').map(Number);
      const [oh,om]=c.outTime.split(':').map(Number);
      const diff=((oh*60+om)-(ih*60+im))/60;
      hours=diff.toFixed(1)+'h';
    }
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="av av-r">${s?ini(s.name):'?'}</div>${s?s.name:'?'}</div></td>
      <td>${c.date}${isSunday(c.date)?'<span class="b ba" style="margin-left:5px;font-size:10px">Sun</span>':''}</td>
      <td>${c.branch}</td>
      <td style="color:var(--green)">${c.inTime||'-'}</td>
      <td style="color:${c.outTime?'var(--amber)':'var(--red)'}">${c.outTime||'—'}</td>
      <td>${hours}</td>
      <td><span class="b ${c.status==='complete'?'bg':c.status==='incomplete'?'ba':'br'}">${c.status}</span></td>
      <td>${c.status==='incomplete'?`<button class="btn bsm btn-b" onclick="fixClockOut('${c.id}')">Set Out Time</button>`:'—'}</td>
    </tr>`;
  }).join('')}</tbody></table>`;
}
function fixClockOut(id){
  const c=DB.clocklog.find(x=>x.id===id);
  const s=DB.staff.find(x=>x.id===c.staffId);
  openModal('Set Clock-Out Time — '+s?.name,`
    <div class="info-box">${s?.name} clocked in at <b>${c.inTime}</b> on <b>${c.date}</b> but did not clock out.</div>
    <div class="frow"><label>Set Clock-Out Time</label><input type="time" id="fix-time" value="18:00"></div>
    <div class="frow"><label>Or mark as</label>
      <select id="fix-action">
        <option value="set">Set clock-out time (count as full day)</option>
        <option value="absent">Mark as absent (don't count this day)</option>
      </select>
    </div>
    <div class="grow">
      <button class="btn btn-p" onclick="applyClockFix('${id}')">Apply</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>`);
}
function applyClockFix(id){
  const action=document.getElementById('fix-action').value;
  const time=document.getElementById('fix-time').value;
  if(action==='set'){DB.clocklog=DB.clocklog.map(c=>c.id===id?{...c,outTime:time,status:'complete',adminFixed:true}:c);}
  else{DB.clocklog=DB.clocklog.map(c=>c.id===id?{...c,status:'absent',adminFixed:true}:c);}
  save();closeModal();toast('Updated ✓');renderClockTbl();
}

  </div>
  <div id="sal-wrap"></div>`;

function renderSalSheet(){
  const mk=document.getElementById('ss-month').value;
  const fb=document.getElementById('ss-branch')?.value||myBranch()||'';
  const [monthName,year]=mk.split(' ');
  const monthIdx=new Date(mk+' 1').getMonth();
  const yearNum=parseInt(year);
  const workingDays=getWorkingDays(yearNum,monthIdx);
  const sundays=getSundaysInMonth(yearNum,monthIdx);
  const totalDays=new Date(yearNum,monthIdx+1,0).getDate();
  const monthAtt=DB.attendance.filter(a=>mkkey(a.date)===mk&&a.status==='approved');
  let staffList=DB.staff.filter(s=>s.active);
  if(fb)staffList=staffList.filter(s=>s.branch===fb);
  let regTotal=0,evtTotal=0,extTotal=0;
  const regRows=staffList.filter(s=>s.type==='regular').map(s=>{
    const daysWorked=DB.clocklog.filter(c=>c.staffId===s.id&&mkkey(c.date)===mk&&c.status==='complete').length;
    const dailyRate=(s.salary||0)/workingDays;
    const extraAbsent=Math.max(0,workingDays-4-daysWorked);
    const deduction=Math.round(extraAbsent*dailyRate);
    const pay=(s.salary||0)-deduction;
    regTotal+=pay;
    return {s,daysWorked,workingDays,extraAbsent,deduction,pay};
  });
  const evtRows=staffList.filter(s=>s.type==='event').map(s=>{
    const rate=getEffectiveRate(s.id,mk);
    const att=monthAtt.filter(a=>a.staffId===s.id);
    const pay=att.length*rate;
    evtTotal+=pay;
    return {s,rate,events:att.length,eventNames:[...new Set(att.map(a=>{const e=DB.events.find(x=>x.id===a.eventId);return e?e.name:'?'}))],pay};
  });
  const extRows=DB.outsourced.filter(o=>mkkey(o.date)===mk&&(!fb||o.branch===fb));
  extTotal=extRows.reduce((s,o)=>s+o.amount,0);
  const grand=regTotal+evtTotal+extTotal;
  const locked=DB.salaryLock[mk+fb];
  const el=document.getElementById('sal-wrap');
  el.innerHTML=`
  <div class="sal-hero">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem">
      <div>
        <div class="sal-total">₹${grand.toLocaleString()}</div>
        <div class="sal-lbl">Grand total payout — ${mk}${fb?' · '+fb:' · All Branches'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">Working days: ${workingDays} (${totalDays} days − ${sundays} Sundays) · 4 paid offs included</div>
      </div>
      ${locked?'<span class="b bg">🔒 Finalized</span>':''}
    </div>
    <div class="sal-breakdown">
      <div class="sbd"><div class="sbd-v" style="color:var(--green)">₹${regTotal.toLocaleString()}</div><div class="sbd-l">Regular Staff</div></div>
      <div class="sbd"><div class="sbd-v" style="color:var(--blue)">₹${evtTotal.toLocaleString()}</div><div class="sbd-l">Event Staff</div></div>
      <div class="sbd"><div class="sbd-v" style="color:var(--amber)">₹${extTotal.toLocaleString()}</div><div class="sbd-l">Outsourced</div></div>
    </div>
  </div>

  <div class="ssep">Regular Staff — Fixed Monthly Salary</div>
  <div class="card">
    <table><thead><tr><th>Name</th><th>Branch</th><th>Monthly Salary</th><th>Working Days</th><th>Days Worked</th><th>Extra Absent</th><th>Deduction</th><th>Final Pay</th></tr></thead>
    <tbody>${regRows.map(({s,daysWorked,workingDays,extraAbsent,deduction,pay})=>`<tr>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="av av-r">${ini(s.name)}</div>${s.name}</div></td>
      <td>${s.branch}</td>
      <td>₹${(s.salary||0).toLocaleString()}</td>
      <td>${workingDays} <span style="font-size:11px;color:var(--muted)">(incl. 4 offs)</span></td>
      <td>${daysWorked}</td>
      <td style="color:${extraAbsent>0?'var(--red)':'var(--muted)'}">${extraAbsent>0?extraAbsent+' days':'—'}</td>
      <td style="color:${deduction>0?'var(--red)':'var(--muted)'}">${deduction>0?'−₹'+deduction.toLocaleString():'—'}</td>
      <td style="font-weight:700;color:var(--gold)">₹${pay.toLocaleString()}</td>
    </tr>`).join('')||'<tr><td colspan="8" class="empty">No regular staff in this selection.</td></tr>'}
    </tbody></table>
  </div>

  <div class="ssep">Event Staff — Per Event Rate</div>
  <div class="card">
    <table><thead><tr><th>Name</th><th>Branch</th><th>Role</th><th>Rate / Event</th><th>Events</th><th>Event Names</th><th>Total Pay</th></tr></thead>
    <tbody>${evtRows.map(({s,rate,events,eventNames,pay})=>`<tr>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="av av-e">${ini(s.name)}</div>${s.name}</div></td>
      <td>${s.branch}</td><td>${s.role}</td>
      <td>₹${rate.toLocaleString()}</td>
      <td style="font-weight:600">${events}</td>
      <td style="font-size:12px;color:var(--muted)">${eventNames.join(', ')||'—'}</td>
      <td style="font-weight:700;color:var(--gold)">₹${pay.toLocaleString()}</td>
    </tr>`).join('')||'<tr><td colspan="7" class="empty">No event staff records.</td></tr>'}
    </tbody></table>
  </div>

  <div class="ssep">Outsourced Staff — External Cost</div>
  <div class="card">
    <table><thead><tr><th>Name</th><th>Role</th><th>Event</th><th>Branch</th><th>Amount</th><th>Payment</th></tr></thead>
    <tbody>${extRows.map(o=>{const e=DB.events.find(x=>x.id===o.eventId);return`<tr>
      <td style="font-weight:500">${o.name} <code style="color:var(--muted)">${o.id}</code></td>
      <td>${o.role}</td><td>${e?e.name:'?'}</td><td>${o.branch}</td>
      <td style="font-weight:600;color:var(--amber)">₹${o.amount.toLocaleString()}</td>
      <td><span class="b ${o.paid?'bg':'br'}">${o.paid?'Paid':'Unpaid'}</span></td>
    </tr>`;}).join('')||'<tr><td colspan="6" class="empty">No outsourced staff this month.</td></tr>'}
    <tr style="border-top:2px solid var(--border2)">
      <td colspan="4" style="font-weight:600;text-align:right;color:var(--muted)">Outsourced Total</td>
      <td style="font-weight:700;color:var(--amber)">₹${extTotal.toLocaleString()}</td><td></td>
    </tr>
    </tbody></table>
  </div>
  ${!locked?`<div class="grow"><button class="btn btn-p" onclick="lockSalary('${mk}','${fb}')">🔒 Finalize & Lock Salary — ${mk}</button><span style="font-size:12px;color:var(--muted)">No edits possible after lock</span></div>`:'<div class="grow"><span class="b bg">🔒 This month is finalized and locked</span></div>'}`;
}
function lockSalary(mk,fb){
  if(confirm('Finalize salary for '+mk+'? No changes can be made after this.')){
    DB.salaryLock[mk+fb]=true;save();toast('Salary finalized & locked ✓');renderSalSheet();
  }
}

      `<div class="clock-status cs-out"><div style="font-weight:500">Not clocked in yet</div></div>

        <span style="color:var(--muted)">Offs used this month</span>
        <span style="font-weight:600">${Math.max(0,getWorkingDays(new Date().getFullYear(),new Date().getMonth())-DB.clocklog.filter(c=>c.staffId===s.id&&c.status==='complete'&&mkkey(c.date)===mkkey(d)).length)} / 4</span>

}
function doClock(type,existingId){
  const s=CU;const d=today();const t=nowtime();
  if(type==='in'){
    const id='CLK-'+uid();
    DB.clocklog.push({id,staffId:s.id,date:d,inTime:t,outTime:'',status:'incomplete',branch:s.branch});
    save();toast('Clocked in at '+t+' ✓');showPage('clockin');
  } else {
    DB.clocklog=DB.clocklog.map(c=>c.id===existingId?{...c,outTime:t,status:'complete'}:c);
    save();toast('Clocked out at '+t+' ✓');showPage('clockin');
  }
}

function pgMyAtt(el){
  const s=CU;

  el.innerHTML=`

    <div class="stat"><div class="sv" style="color:var(--green)">${complete}</div><div class="sl">Days Present</div></div>

      let hrs='-';
      if(c.inTime&&c.outTime){const[ih,im]=c.inTime.split(':').map(Number);const[oh,om]=c.outTime.split(':').map(Number);hrs=((oh*60+om-ih*60-im)/60).toFixed(1)+'h';}
      return `<tr>
        <td>${c.date}</td><td>${day}</td>
        <td style="color:var(--green)">${c.inTime||'-'}</td>
        <td style="color:var(--amber)">${c.outTime||'—'}</td>
        <td>${hrs}</td>
        <td><span class="b ${c.status==='complete'?'bg':c.status==='incomplete'?'ba':'br'}">${c.status}</span></td>
      </tr>`;
    }).join('')||'<tr><td colspan="6" class="empty">No records this month</td></tr>'}
    </tbody></table></div>
  </div>`;
}

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center">
    <select id="rpt-mo">${months.map(m=>`<option>${m}</option>`).join('')}</select>
    ${!br?`<select id="rpt-br"><option value="">All Branches</option>${BRANCHES.map(b=>`<option>${b}</option>`).join('')}</select>`:''}
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:1rem">
    ${[
      {t:'Daily Report',icon:'📅',sub:'Clock log + event attendance today',type:'daily'},
      {t:'Monthly Salary',icon:'📆',sub:'Full salary sheet — regular, event, outsourced',type:'monthly'},
      {t:'Event-wise',icon:'🎪',sub:'Who attended each event with GPS status',type:'events'},
      {t:'Staff Master',icon:'👥',sub:'All staff, roles, branches, rates',type:'staff'},
    ].map(r=>`<div onclick="doExport('${r.type}')" style="background:var(--dk3);border:1px solid var(--border2);border-radius:12px;padding:1rem;cursor:pointer;transition:all .2s" onmouseover="this.style.borderColor='var(--gold)'" onmouseout="this.style.borderColor='var(--border2)'">
      <div style="font-size:24px;margin-bottom:8px">${r.icon}</div>
      <div style="font-family:var(--ff);font-size:14px;font-weight:600;margin-bottom:3px">${r.t}</div>
      <div style="font-size:12px;color:var(--muted)">${r.sub}</div>
    </div>`).join('')}
  </div>
  <div class="info-box">📌 Photos in attendance show as YES/NO in Excel. GPS coordinates are clickable links. All amounts in Indian Rupees (₹).</div>
  ${gdSheetId?`<div class="grow"><button class="btn btn-b" onclick="openGSheet()">📋 Open Live Google Sheet →</button><button class="btn btn-gd" onclick="gdSync()">↻ Sync to Drive Now</button></div>`:''}`;
}
function doExport(type){
  const mo=document.getElementById('rpt-mo')?.value||mkkey(today());
  const br=document.getElementById('rpt-br')?.value||myBranch()||'';
  exportExcel(type,mo,br);
}

// ─── GOOGLE DRIVE PAGE ────────────────────────────────────────
function pgGDrivePage(el) {
  const lastSync=localStorage.getItem('rz_last_sync')||'Never';
  el.innerHTML=`
  <div class="ptitle">Google Drive</div>
  <div class="psub">Auto-sync all data to your Google Drive spreadsheet.</div>
  <div style="background:linear-gradient(135deg,rgba(52,168,83,.12),rgba(66,133,244,.08));border:1px solid rgba(52,168,83,.25);border-radius:15px;padding:1.25rem;margin-bottom:1rem">
    <div style="font-family:var(--ff);font-size:15px;font-weight:700;margin-bottom:.5rem">☁ Google Drive Integration</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:1rem;line-height:1.7">
      When connected, every change syncs automatically to a Google Sheet named <b>"${SHEET_NAME}"</b> in your Drive. Open it anytime, share it, or download as Excel from Google Drive.
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:.75rem">
      <div>
        <div style="font-size:13px;font-weight:500">Status: <span style="color:${gdToken?'var(--green)':'var(--red)'}">${gdToken?'Connected ✓':'Not connected'}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">Last sync: ${lastSync}</div>
      </div>
      ${gdToken?`<button class="btn" style="background:rgba(52,168,83,.15);color:#34A853;border-color:rgba(52,168,83,.3)" onclick="gdSync()">↻ Sync Now</button>
        <button class="btn btn-b" onclick="openGSheet()">Open Sheet →</button>`:
        `<button class="btn" style="background:rgba(52,168,83,.15);color:#34A853;border-color:rgba(52,168,83,.3)" onclick="connectGDrive()">Connect Google Drive</button>`}
    </div>
    ${!gdToken?`<div class="info-box">
      <b>Steps to connect:</b><br>
      1. Go to <a href="https://console.cloud.google.com" target="_blank" style="color:var(--gold)">console.cloud.google.com</a><br>
      2. New project → Enable <b>Google Drive API</b> + <b>Google Sheets API</b><br>
      3. Credentials → OAuth 2.0 Client ID → Web Application<br>
      4. Add your site URL as Authorised JavaScript Origin<br>
      5. Copy Client ID → open this HTML file → paste at <code>GD_CLIENT_ID</code> top of script<br><br>
      <b>Until connected:</b> data saves locally in browser. Export Excel anytime from Reports page.
    </div>`:''}
  </div>
  <div class="card">
    <div class="ctitle">Backup & Restore</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:1rem">Download a full JSON backup of all system data. Store it safely — you can restore everything from it anytime.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-p" onclick="backupJSON()">⬇ Download Full Backup</button>
      <button class="btn" onclick="document.getElementById('ri').click()">⬆ Restore from Backup</button>
      <input type="file" id="ri" accept=".json" style="display:none" onchange="restoreJSON(this)">
    </div>
  </div>`;
}

</script>
